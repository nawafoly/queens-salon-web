name: Repair Employee Lifecycle Applicator V4

on:
  push:
    branches:
      - fix/employee-lifecycle-integrity-20261004
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/employee-lifecycle-integrity-20261004
          fetch-depth: 0

      - name: Repair applicator syntax
        run: node scripts/repair-employee-lifecycle-applicator-v4.mjs

      - name: Remove repair artifacts
        run: |
          rm scripts/repair-employee-lifecycle-applicator-v4.mjs
          rm .github/workflows/repair-employee-lifecycle-applicator-v4.yml
          rm -f scripts/repair-employee-lifecycle-applicator-v3.mjs
          rm -f .github/workflows/repair-employee-lifecycle-applicator-v3.yml

      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "chore: fix lifecycle applicator syntax"
          git push origin HEAD:fix/employee-lifecycle-integrity-20261004
