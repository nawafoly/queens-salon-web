name: Refine Leave Permission UI

on:
  push:
    branches: [main]
    paths:
      - "scripts/refine-leave-permission-ui.mjs"
      - ".github/workflows/refine-leave-permission-ui.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refine-leave-permission-ui-main
  cancel-in-progress: false

jobs:
  verify-and-promote:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Apply leave permission UI refinement
        run: node scripts/refine-leave-permission-ui.mjs

      - name: Verify UI and operational contract
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const modal = fs.readFileSync('src/components/LeaveRequestModal.tsx', 'utf8');
          const live = fs.readFileSync('src/components/dashboard-v2/employee-workspace/live/EmployeeWorkspaceOperationalTabsLiveV2.tsx', 'utf8');
          const dashboard = fs.readFileSync('src/pages/DashboardEmployees.tsx', 'utf8');
          const permissions = fs.readFileSync('workers/core/repositories/permissions.js', 'utf8');

          const checks = [
            [modal.includes('title="تسجيل إجازة أو استئذان"'), 'combined modal title missing'],
            [modal.includes('{ value: "full_day", label: "إجازة" }'), 'leave registration option missing'],
            [modal.includes('{ value: "partial", label: "استئذان" }'), 'permission registration option missing'],
            [modal.includes('{!isPartialLeave ? (\n          <DashboardFieldV2 id="leave-type-v2"'), 'leave type is not conditional'],
            [modal.includes('label={isPartialLeave ? "سبب الاستئذان" : "ملاحظة"}'), 'permission reason label missing'],
            [modal.includes('{!isPartialLeave ? (\n            <div className="dsv2-ew-switch-list'), 'leave accounting switches still shown for permission'],
            [live.includes('تسجيل إجازة أو استئذان'), 'attendance action label missing'],
            [live.includes('استئذان معتمد — الفترة فقط محجوبة'), 'permission review grammar missing'],
            [dashboard.includes('createPermissionRequest, reviewPermissionRequest'), 'admin permission service import missing'],
            [dashboard.includes('source: "admin_direct"'), 'admin permission is not using permission source'],
            [dashboard.includes('financialEffect: "none"'), 'admin permission financial default must be none'],
            [dashboard.includes('description: "تسجيل استئذان معتمد وربطه بالحضور والحجز"'), 'admin permission audit missing'],
            [permissions.includes('await syncPermissionBookingBlock(db, salonId, row, actor);'), 'Core permission booking sync missing'],
            [permissions.includes("leave_type = 'permission'"), 'Core permission booking type missing'],
          ];
          for (const [ok, message] of checks) {
            if (!ok) throw new Error(message);
          }
          console.log('[leave-permission-ui] contract verified');
          NODE

      - name: Build
        run: npm run build

      - name: Admin partial and permission policy tests
        run: node --test workers/admin-partial-leave-policy.test.mjs

      - name: Core worker tests
        run: npm run test:core:worker

      - name: HR worker tests
        run: npm run test:hr:worker

      - name: Frontend Core migration tests
        run: npm run test:frontend:core

      - name: Frontend Core migration guard
        run: npm run check:frontend-core-migration

      - name: No legacy booking runtime guard
        run: node scripts/check-no-legacy-booking-runtime.mjs

      - name: Booking runtime audit
        run: node scripts/audit-legacy-booking-runtime.mjs

      - name: Diff check
        run: git diff --check

      - name: Promote only after green gate
        shell: bash
        run: |
          set -euo pipefail
          git add \
            src/components/LeaveRequestModal.tsx \
            src/components/dashboard-v2/employee-workspace/live/EmployeeWorkspaceOperationalTabsLiveV2.tsx \
            src/pages/DashboardEmployees.tsx
          if git diff --cached --quiet; then
            echo "No production changes to promote."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Clarify leave and permission registration UI"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
