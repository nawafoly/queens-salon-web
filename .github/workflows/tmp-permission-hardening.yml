name: Temporary Permission Hardening
on:
  push:
    branches:
      - fix/employee-request-workflow-hardening
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/employee-request-workflow-hardening
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Harden permission lifecycle
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          p = Path('workers/core/repositories/employee-requests-legacy.js')
          text = p.read_text(encoding='utf-8')
          start = text.index('async function createPermissionEffect(')
          end = text.index('\nfunction employeeRequestLeavePolicy', start)
          new_fn = '''async function createPermissionEffect(db, salonId, row, payload, actor) {
            const existing = await dbFirst(db,
              'SELECT * FROM employee_permission_requests WHERE salon_id = ? AND (id = ? OR employee_request_id = ?) LIMIT 1',
              [salonId, row.source_reference_id || '', row.id]
            );
            if (existing) return existing.id;
            const permissionRows = await dbAll(
              db,
              `SELECT id, requested_exit_time, expected_return_time FROM employee_permission_requests
                WHERE salon_id = ? AND employee_id = ? AND date_key = ?
                  AND status IN ('approved', 'out', 'returned')`,
              [salonId, row.employee_id, payload.date]
            );
            if (permissionRows.some((item) => item.expected_return_time && intervalsOverlap(payload.startTime, payload.endTime, item.requested_exit_time, item.expected_return_time))) {
              throw new AppError(409, 'core_employee_request:permission_overlap');
            }
            const id = generatedId('permission');
            const bookingLeaveId = "permission_leave_" + id.replace(/[^A-Za-z0-9_-]/g, "_");
            const now = nowIso();
            await dbBatch(db, [
              {
                sql: `INSERT INTO employee_permission_requests
                  (id, salon_id, employee_id, employee_uid, employee_name, date_key,
                   requested_exit_time, expected_return_time, actual_exit_time, actual_return_time,
                   reason, note, source, status, financial_effect, duration_minutes, unpaid_minutes,
                   created_by_uid, created_by_name, reviewer_uid, reviewer_name, returned_by_uid,
                   returned_by_name, reviewed_at, exited_at, returned_at, created_at, updated_at, employee_request_id)
                 VALUES (?, ?, ?, ?, ?, ?, ?, ?, NULL, NULL, ?, ?, 'employee_request', 'approved', 'none', 0, 0,
                   ?, ?, ?, ?, NULL, NULL, ?, NULL, NULL, ?, ?, ?)`,
                params: [
                  id, salonId, row.employee_id, row.employee_uid, row.employee_name_snapshot, payload.date,
                  payload.startTime, payload.endTime, payload.reason, optionalText(payload.notes) || null,
                  row.created_by_uid, row.employee_name_snapshot, cleanText(actor.uid) || null,
                  cleanText(actor.name) || null, now, now, now, row.id,
                ],
              },
              {
                sql: `INSERT OR IGNORE INTO employee_leaves
                  (id, salon_id, employee_id, employee_uid, employee_name, employee_email, status,
                   leave_type, start_date, end_date, days_count, employee_note, hr_note, decided_at,
                   decided_by_uid, decided_by_email, decided_by_name, created_at, updated_at,
                   duration_kind, partial_start_time, partial_end_time, request_id)
                 VALUES (?, ?, ?, ?, ?, NULL, 'approved', 'permission', ?, ?, 0, ?, ?, ?, ?, ?, ?, ?, ?, 'partial', ?, ?, ?)`,
                params: [
                  bookingLeaveId, salonId, row.employee_id, row.employee_uid, row.employee_name_snapshot,
                  payload.date, payload.date, payload.reason, 'استئذان معتمد — يحجب فترة الحجز المحددة فقط',
                  now, cleanText(actor.uid) || null, cleanText(actor.email) || null, cleanText(actor.name) || null,
                  now, now, payload.startTime, payload.endTime, id,
                ],
              },
            ]);
            return id;
          }
'''
          p.write_text(text[:start] + new_fn + text[end:], encoding='utf-8')

          replace_once(
            'workers/core/repositories/employee-requests-legacy.js',
            "return { sourceType: 'employee_permission_request', sourceId: id, before: null, after: { status: 'returned' } };",
            "return { sourceType: 'employee_permission_request', sourceId: id, before: null, after: { status: 'approved' } };"
          )

          p = Path('workers/core/repositories/permissions.js')
          text = p.read_text(encoding='utf-8')
          old = '''    await dbRun(
      db,
      `UPDATE employee_permission_requests
          SET status = 'returned', financial_effect = ?, actual_exit_time = ?,
              actual_return_time = ?, duration_minutes = ?, unpaid_minutes = ?,
              reviewer_uid = ?, reviewer_name = ?, returned_by_uid = ?, returned_by_name = ?,
              reviewed_at = ?, exited_at = ?, returned_at = ?, updated_at = ?
        WHERE salon_id = ? AND id = ?`,
      [
        financialEffect,
        exitTime,
        approvedReturnTime,
        minutes,
        unpaidMinutes,
        optionalText(actor.uid) || null,
        optionalText(actor.name) || null,
        optionalText(actor.uid) || null,
        optionalText(actor.name) || null,
        now,
        now,
        now,
        now,
        salonId,
        row.id,
      ]
    );
    await insertEvent(db, salonId, row.id, 'approved', actor, {
      financialEffect,
      autoFinalized: true,
      exitTime,
      returnTime: approvedReturnTime,
      durationMinutes: minutes,
    });
    const updated = await getPermission(db, salonId, row.id);
    await syncPermissionBookingBlock(db, salonId, updated, actor);
    await insertAttendanceEvent(db, salonId, updated, 'permission_out', exitTime, actor);
    await insertAttendanceEvent(db, salonId, updated, 'permission_return', approvedReturnTime, actor);
    await refreshPayrollEntries(db, salonId, updated.employee_id, updated.date_key);
    await notifyEmployee(
      db,
      salonId,
      updated,
      'تمت الموافقة واعتماد وقت الاستئذان',
      `${updated.date_key} • من ${exitTime} إلى ${approvedReturnTime} • المدة ${minutes} دقيقة`
    );
    return updated;'''
          new = '''    await dbRun(
      db,
      `UPDATE employee_permission_requests
          SET status = 'approved', financial_effect = ?, actual_exit_time = NULL,
              actual_return_time = NULL, duration_minutes = 0, unpaid_minutes = 0,
              reviewer_uid = ?, reviewer_name = ?, returned_by_uid = NULL, returned_by_name = NULL,
              reviewed_at = ?, exited_at = NULL, returned_at = NULL, updated_at = ?
        WHERE salon_id = ? AND id = ?`,
      [
        financialEffect,
        optionalText(actor.uid) || null,
        optionalText(actor.name) || null,
        now,
        now,
        salonId,
        row.id,
      ]
    );
    await insertEvent(db, salonId, row.id, 'approved', actor, {
      financialEffect,
      autoFinalized: false,
      exitTime,
      returnTime: approvedReturnTime,
      requestedMinutes: minutes,
    });
    const updated = await getPermission(db, salonId, row.id);
    await syncPermissionBookingBlock(db, salonId, updated, actor);
    await notifyEmployee(
      db,
      salonId,
      updated,
      'تمت الموافقة على طلب الاستئذان',
      `${updated.date_key} • من ${exitTime} إلى ${approvedReturnTime}`
    );
    return updated;'''
          if text.count(old) != 1:
              raise SystemExit(f'permissions.js approval block mismatch: {text.count(old)}')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')

          test = Path('workers/permission-lifecycle-hardening.test.mjs')
          test.write_text('''import test from "node:test";\nimport assert from "node:assert/strict";\nimport { readFileSync } from "node:fs";\n\ntest("approved permission is not auto-finalized as returned", () => {\n  const permissions = readFileSync("workers/core/repositories/permissions.js", "utf8");\n  const requests = readFileSync("workers/core/repositories/employee-requests-legacy.js", "utf8");\n  assert.match(permissions, /SET status = \'approved\'/);\n  assert.match(permissions, /autoFinalized: false/);\n  assert.doesNotMatch(permissions, /autoFinalized: true/);\n  const start = requests.indexOf("async function createPermissionEffect");\n  const end = requests.indexOf("function employeeRequestLeavePolicy", start);\n  const block = requests.slice(start, end);\n  assert.match(block, /\'employee_request\', \'approved\'/);\n  assert.doesNotMatch(block, /permission_out/);\n  assert.doesNotMatch(block, /permission_return/);\n  assert.match(requests, /after: \{ status: \'approved\' \}/);\n});\n''', encoding='utf-8')
          PY
      - name: Verify
        run: |
          npm ci
          node --test workers/permission-lifecycle-hardening.test.mjs
          node scripts/check-employee-leave-core-cutover.mjs
          npm run build
          git diff --check
      - name: Commit patch
        run: |
          git config user.name "nawafoly"
          git config user.email "114729674+nawafoly@users.noreply.github.com"
          git add workers/core/repositories/permissions.js workers/core/repositories/employee-requests-legacy.js workers/permission-lifecycle-hardening.test.mjs
          git commit -m "fix(hr): preserve actual permission out and return lifecycle"
          git push
