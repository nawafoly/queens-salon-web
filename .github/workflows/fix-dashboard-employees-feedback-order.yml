name: Fix Dashboard Employee Feedback Order

on:
  push:
    branches:
      - fix/dashboard-action-feedback-system-20261004

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/dashboard-action-feedback-system-20261004
          fetch-depth: 0

      - name: Apply source fix
        run: node scripts/fix-dashboard-employees-feedback-order.mjs

      - name: Remove temporary patch files
        run: |
          git rm scripts/fix-dashboard-employees-feedback-order.mjs
          git rm .github/workflows/fix-dashboard-employees-feedback-order.yml

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(ui): order employee feedback state before effects"
          git push origin HEAD:fix/dashboard-action-feedback-system-20261004
