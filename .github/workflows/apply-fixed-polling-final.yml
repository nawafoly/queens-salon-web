name: Apply Fixed Polling Final

on:
  push:
    branches:
      - perf/remove-fixed-polling-final

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Apply polling consolidation
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'missing expected block: {label} ({path})')
              text = text.replace(old, new, 1)
              p.write_text(text, encoding='utf-8')

          def regex_once(path, pattern, repl, label):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              text, count = re.subn(pattern, repl, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'expected one regex match for {label}, got {count} ({path})')
              p.write_text(text, encoding='utf-8')

          # Profile: remove fixed 30s client portal polling.
          replace_once(
              'src/pages/Profile.tsx',
              '''    void loadPortal(false);\n    const interval = window.setInterval(() => void loadPortal(true), 30_000);\n    const onVisibility = () => {\n      if (document.visibilityState === "visible") void loadPortal(true);\n    };\n    document.addEventListener("visibilitychange", onVisibility);\n    return () => {\n      alive = false;\n      window.clearInterval(interval);\n      document.removeEventListener("visibilitychange", onVisibility);\n    };''',
              '''    const refreshWhenActive = () => {\n      if (!alive || document.visibilityState === "hidden") return;\n      void loadPortal(true);\n    };\n    const onVisibility = () => {\n      if (document.visibilityState === "visible") refreshWhenActive();\n    };\n\n    void loadPortal(false);\n    window.addEventListener("focus", refreshWhenActive);\n    window.addEventListener("online", refreshWhenActive);\n    document.addEventListener("visibilitychange", onVisibility);\n    return () => {\n      alive = false;\n      window.removeEventListener("focus", refreshWhenActive);\n      window.removeEventListener("online", refreshWhenActive);\n      document.removeEventListener("visibilitychange", onVisibility);\n    };''',
              'Profile event-driven refresh',
          )

          # Dashboard: clean dead imports from removed auto loop.
          replace_once(
              'src/pages/Dashboard.tsx',
              '''import {\n  listAllBookings as listAllBookingsFS,\n  updateBookingStatus as updateBookingStatusFS,\n  type BookingDocWithId,\n} from "../services/firestoreBookings";''',
              '''import {\n  listAllBookings as listAllBookingsFS,\n  type BookingDocWithId,\n} from "../services/firestoreBookings";''',
              'Dashboard booking import cleanup',
          )
          replace_once(
              'src/pages/Dashboard.tsx',
              '''import {\n  formatLocalDateISO,\n  weekdayKeyFromISODate,\n  type DashboardWeekdayKey,\n} from "../helpers/dashboardDateUtils";''',
              '''import {\n  formatLocalDateISO,\n  type DashboardWeekdayKey,\n} from "../helpers/dashboardDateUtils";''',
              'Dashboard date util cleanup',
          )

          # Dashboard: expense-note badge becomes event/focus driven.
          regex_once(
              'src/pages/Dashboard.tsx',
              r'''  // ✅ Badge المصروفات بدون ملاحظات \(AdminPower only\)\n  useEffect\(\(\) => \{.*?\n  \}, \[hasPermission, userInfo\?\.role\]\);\n''',
              '''  // Badge المصروفات بدون ملاحظات: event/focus-driven without fixed polling.\n  useEffect(() => {\n    if (!userInfo) return;\n\n    if (!hasPermission("expenses.view")) {\n      setMissingExpenseNotesCount(0);\n      return;\n    }\n\n    let alive = true;\n    let inFlight = false;\n    let lastRefreshAt = 0;\n\n    const load = async (force = false) => {\n      if (!alive || inFlight) return;\n      const now = Date.now();\n      if (!force && now - lastRefreshAt < 1_000) return;\n      inFlight = true;\n      try {\n        const n = await countMonthlyExpensesMissingNotesCore();\n        if (alive) setMissingExpenseNotesCount(Number(n || 0));\n      } catch {\n        if (alive) setMissingExpenseNotesCount(0);\n      } finally {\n        inFlight = false;\n        lastRefreshAt = Date.now();\n      }\n    };\n\n    const refreshWhenActive = () => {\n      if (document.visibilityState === "hidden") return;\n      void load();\n    };\n    const onVisibility = () => {\n      if (document.visibilityState === "visible") refreshWhenActive();\n    };\n\n    void load(true);\n    window.addEventListener("focus", refreshWhenActive);\n    window.addEventListener("online", refreshWhenActive);\n    document.addEventListener("visibilitychange", onVisibility);\n\n    return () => {\n      alive = false;\n      window.removeEventListener("focus", refreshWhenActive);\n      window.removeEventListener("online", refreshWhenActive);\n      document.removeEventListener("visibilitychange", onVisibility);\n    };\n  }, [hasPermission, userInfo?.role]);\n''',
              'Dashboard expense badge polling removal',
          )

          # Dashboard: remove dead 5-minute auto scan; keep refresh semantics via active-window events.
          regex_once(
              'src/pages/Dashboard.tsx',
              r'''  // ✅ Auto Job \(Client-side\): كل 5 دقائق\n.*?\n  \],\);\n\n  useEffect\(\(\) => \{\n    if \(!hasExternalAuthBootstrap\) return;''',
              '''  // Dashboard refreshes when the operator returns to an active window.\n  useEffect(() => {\n    if (!userInfo?.role || isHrWorkspacePage) return;\n\n    const role = userInfo.role;\n    let disposed = false;\n    let refreshInFlight = false;\n    let lastRefreshAt = 0;\n\n    const refreshWhenActive = () => {\n      if (disposed || refreshInFlight || document.visibilityState === "hidden") return;\n      const now = Date.now();\n      if (now - lastRefreshAt < 1_500) return;\n      lastRefreshAt = now;\n      refreshInFlight = true;\n      void refreshDashboard(role, { silent: true }).finally(() => {\n        refreshInFlight = false;\n      });\n    };\n    const onVisibility = () => {\n      if (document.visibilityState === "visible") refreshWhenActive();\n    };\n\n    window.addEventListener("focus", refreshWhenActive);\n    window.addEventListener("online", refreshWhenActive);\n    document.addEventListener("visibilitychange", onVisibility);\n\n    return () => {\n      disposed = true;\n      window.removeEventListener("focus", refreshWhenActive);\n      window.removeEventListener("online", refreshWhenActive);\n      document.removeEventListener("visibilitychange", onVisibility);\n    };\n  }, [userInfo?.role, isHrWorkspacePage]);\n\n  useEffect(() => {\n    if (!hasExternalAuthBootstrap) return;''',
              'Dashboard dead 5-minute scan removal',
          )

          # Queue TV: adaptive foreground scheduler with hidden-tab pause and backoff.
          replace_once(
              'src/pages/DashboardQueueTv.tsx',
              'const QUEUE_REFRESH_MS = 8_000;',
              '''const QUEUE_REFRESH_ACTIVE_MS = 8_000;\nconst QUEUE_REFRESH_IDLE_MS = 20_000;\nconst QUEUE_REFRESH_MAX_MS = 60_000;''',
              'Queue refresh constants',
          )
          regex_once(
              'src/pages/DashboardQueueTv.tsx',
              r'''  useEffect\(\(\) => \{\n    let active = true;\n    let firstLoad = true;\n    let inFlight = false;\n.*?\n  \}, \[todayKey\]\);''',
              '''  useEffect(() => {\n    let active = true;\n    let firstLoad = true;\n    let inFlight = false;\n    let refreshTimer: number | null = null;\n    let unchangedStreak = 0;\n    let failureStreak = 0;\n    let lastSignature = "";\n\n    const clearRefreshTimer = () => {\n      if (refreshTimer !== null) {\n        window.clearTimeout(refreshTimer);\n        refreshTimer = null;\n      }\n    };\n\n    const nextSuccessDelay = () => {\n      if (unchangedStreak >= 8) return QUEUE_REFRESH_MAX_MS;\n      if (unchangedStreak >= 3) return QUEUE_REFRESH_IDLE_MS;\n      return QUEUE_REFRESH_ACTIVE_MS;\n    };\n\n    const scheduleNext = (delayMs: number) => {\n      clearRefreshTimer();\n      if (!active || document.visibilityState === "hidden") return;\n      refreshTimer = window.setTimeout(() => {\n        refreshTimer = null;\n        void loadBookings("timer");\n      }, delayMs);\n    };\n\n    const loadBookings = async (_source: "initial" | "timer" | "event") => {\n      if (!active || inFlight) return;\n      if (_source === "timer" && document.visibilityState === "hidden") return;\n      inFlight = true;\n      let failed = false;\n      if (firstLoad) {\n        setLoading(true);\n        setError("");\n      }\n      try {\n        const rows = await resolveBookingDataSource().searchBookings({ date: todayKey });\n        if (!active) return;\n        const next = rows\n          .map((row) => queueBookingFromDoc(row, todayKey))\n          .filter((b) => !["cancelled", "canceled", "rejected"].includes(b.status))\n          .sort((a, b) => toMinutes(a.time) - toMinutes(b.time));\n        const signature = next\n          .map((b) => [b.id, b.status, b.date, b.time, b.employeeName, b.clientName].join("~"))\n          .join("|");\n        unchangedStreak = signature === lastSignature ? Math.min(unchangedStreak + 1, 20) : 0;\n        lastSignature = signature;\n        failureStreak = 0;\n        setBookings(next);\n        setError("");\n      } catch (loadError) {\n        failed = true;\n        failureStreak = Math.min(failureStreak + 1, 4);\n        if (!active) return;\n        console.error("[DashboardQueueTv] Booking load failed", loadError);\n        setError(copy.loadError);\n      } finally {\n        inFlight = false;\n        if (!active) return;\n        setLoading(false);\n        firstLoad = false;\n        const delay = failed\n          ? Math.min(QUEUE_REFRESH_MAX_MS, 15_000 * (2 ** Math.max(0, failureStreak - 1)))\n          : nextSuccessDelay();\n        scheduleNext(delay);\n      }\n    };\n\n    const refreshWhenActive = () => {\n      if (!active || inFlight || document.visibilityState === "hidden") return;\n      clearRefreshTimer();\n      unchangedStreak = 0;\n      void loadBookings("event");\n    };\n    const onVisibility = () => {\n      if (document.visibilityState === "visible") {\n        refreshWhenActive();\n      } else {\n        clearRefreshTimer();\n      }\n    };\n\n    void loadBookings("initial");\n    window.addEventListener("focus", refreshWhenActive);\n    window.addEventListener("online", refreshWhenActive);\n    document.addEventListener("visibilitychange", onVisibility);\n\n    return () => {\n      active = false;\n      clearRefreshTimer();\n      window.removeEventListener("focus", refreshWhenActive);\n      window.removeEventListener("online", refreshWhenActive);\n      document.removeEventListener("visibilitychange", onVisibility);\n    };\n  }, [todayKey]);''',
              'Queue adaptive refresh',
          )
          replace_once(
              'src/pages/DashboardQueueTv.tsx',
              '<span className="dsv2-badge dsv2-badge--success">تحديث تلقائي كل 8 ثوانٍ</span>',
              '<span className="dsv2-badge dsv2-badge--success">تحديث ذكي تلقائي</span>',
              'Queue refresh label',
          )

          # Booking compatibility watchers: initial + active-window events, no fixed interval.
          regex_once(
              'src/services/firestoreBookings.ts',
              r'''/\*\* Core D1 polling watcher for all bookings\. \*/\nexport function watchAllBookings\(\n  onData: \(rows: BookingDocWithId\[\]\) => void,\n  onError\?: \(err: unknown\) => void,\n  scope\?: BookingReadScope\n\) \{.*?\n\}\n\nexport async function listUserBookings''',
              '''/** Core D1 compatibility watcher without fixed-interval polling. */\nexport function watchAllBookings(\n  onData: (rows: BookingDocWithId[]) => void,\n  onError?: (err: unknown) => void,\n  scope?: BookingReadScope\n) {\n  let stopped = false;\n  let loading = false;\n  const loadCore = async () => {\n    if (stopped || loading) return;\n    loading = true;\n    try {\n      const rows = await listCoreBookings(scope);\n      if (!stopped) onData(rows);\n    } catch (error) {\n      if (!stopped) onError?.(error);\n    } finally {\n      loading = false;\n    }\n  };\n  const refreshWhenActive = () => {\n    if (stopped || document.visibilityState === "hidden") return;\n    void loadCore();\n  };\n  const onVisibility = () => {\n    if (document.visibilityState === "visible") refreshWhenActive();\n  };\n\n  void loadCore();\n  window.addEventListener("focus", refreshWhenActive);\n  window.addEventListener("online", refreshWhenActive);\n  document.addEventListener("visibilitychange", onVisibility);\n  return () => {\n    stopped = true;\n    window.removeEventListener("focus", refreshWhenActive);\n    window.removeEventListener("online", refreshWhenActive);\n    document.removeEventListener("visibilitychange", onVisibility);\n  };\n}\n\nexport async function listUserBookings''',
              'watchAllBookings polling removal',
          )
          regex_once(
              'src/services/firestoreBookings.ts',
              r'''export function watchEmployeeBookings\(\n  employeeIdOrUid: string,\n  employeeName: string \| undefined,\n  onData: \(rows: BookingDocWithId\[\]\) => void,\n  onError\?: \(err: unknown\) => void\n\) \{.*?\n\}\n\n/\* =========================\n   UPDATE''',
              '''export function watchEmployeeBookings(\n  employeeIdOrUid: string,\n  employeeName: string | undefined,\n  onData: (rows: BookingDocWithId[]) => void,\n  onError?: (err: unknown) => void\n) {\n  let stopped = false;\n  let loading = false;\n  const load = async () => {\n    if (stopped || loading) return;\n    loading = true;\n    try {\n      if (!stopped) onData(await listEmployeeBookings(employeeIdOrUid, employeeName));\n    } catch (error) {\n      if (!stopped) onError?.(error);\n    } finally {\n      loading = false;\n    }\n  };\n  const refreshWhenActive = () => {\n    if (stopped || document.visibilityState === "hidden") return;\n    void load();\n  };\n  const onVisibility = () => {\n    if (document.visibilityState === "visible") refreshWhenActive();\n  };\n\n  void load();\n  window.addEventListener("focus", refreshWhenActive);\n  window.addEventListener("online", refreshWhenActive);\n  document.addEventListener("visibilitychange", onVisibility);\n  return () => {\n    stopped = true;\n    window.removeEventListener("focus", refreshWhenActive);\n    window.removeEventListener("online", refreshWhenActive);\n    document.removeEventListener("visibilitychange", onVisibility);\n  };\n}\n\n/* =========================\n   UPDATE''',
              'watchEmployeeBookings polling removal',
          )

          # Migration contract: forbid the old booking watcher timer and require active-window refresh hooks.
          replace_once(
              'workers/frontend-core-migration.test.mjs',
              '  assert.match(watchBlock, /setInterval\\(loadCore,\\s*8_000\\)/);',
              '''  assert.match(watchBlock, /visibilitychange/);\n  assert.match(watchBlock, /addEventListener\\("focus", refreshWhenActive\\)/);\n  assert.match(watchBlock, /addEventListener\\("online", refreshWhenActive\\)/);\n  assert.doesNotMatch(watchBlock, /setInterval\\(/);''',
              'Core watcher migration contract',
          )
          replace_once(
              'workers/frontend-core-migration.test.mjs',
              '  assert.doesNotMatch(watchBlock, /getDataSourceFlags|watchFirestoreBookings/);',
              '''  assert.doesNotMatch(watchBlock, /getDataSourceFlags|watchFirestoreBookings/);\n\n  const employeeWatchStart = service.indexOf("export function watchEmployeeBookings");\n  const employeeWatchEnd = service.indexOf("/* =========================\\n   UPDATE", employeeWatchStart);\n  const employeeWatchBlock = service.slice(employeeWatchStart, employeeWatchEnd);\n  assert.match(employeeWatchBlock, /visibilitychange/);\n  assert.match(employeeWatchBlock, /addEventListener\\("focus", refreshWhenActive\\)/);\n  assert.match(employeeWatchBlock, /addEventListener\\("online", refreshWhenActive\\)/);\n  assert.doesNotMatch(employeeWatchBlock, /setInterval\\(/);''',
              'Employee watcher migration contract',
          )

          # Final guard baseline: only reviewed local UI clocks remain allowed.
          regex_once(
              'scripts/check-fixed-interval-polling.mjs',
              r'''const BASELINE = \[.*?\n\];''',
              '''const BASELINE = [\n  {\n    path: "src/components/Hero.tsx",\n    marker: "setInterval(() => setNow(new Date()), 60000)",\n    kind: "local-only",\n    note: "UI clock only; no network or database read.",\n  },\n  {\n    path: "src/pages/Dashboard.tsx",\n    marker: "setInterval(() => setTopbarNowMs(Date.now()), 1000)",\n    kind: "local-only",\n    note: "TV queue topbar clock only; no network or database read.",\n  },\n  {\n    path: "src/pages/DashboardQueueTv.tsx",\n    marker: "setNowMs(now.getTime())",\n    kind: "local-only",\n    note: "Queue clock/countdown only; no network or database read.",\n  },\n  {\n    path: "src/pages/DashboardDayAudit.tsx",\n    marker: "setTodayLimitKey(todayISO())",\n    kind: "local-only",\n    note: "Local day-boundary clock only; no network or database read.",\n  },\n  {\n    path: "src/pages/DashboardEmployees.tsx",\n    marker: "setInterval(() => setNowTick(Date.now()), 60_000)",\n    kind: "local-only",\n    note: "UI time tick only; no network or database read.",\n  },\n];''',
              'Final polling guard baseline',
          )

          # Sanity: no known fixed data polling markers may remain.
          forbidden = {
              'src/pages/Profile.tsx': ['setInterval(() => void loadPortal(true), 30_000)'],
              'src/pages/Dashboard.tsx': ['setInterval(load, 60_000)', 'setInterval(tick, 5 * 60_000)'],
              'src/pages/DashboardQueueTv.tsx': ['setInterval(() => void loadBookings()', 'QUEUE_REFRESH_MS'],
              'src/services/firestoreBookings.ts': ['setInterval(loadCore, 8_000)', 'setInterval(load, 12_000)'],
          }
          for path, markers in forbidden.items():
              text = Path(path).read_text(encoding='utf-8')
              for marker in markers:
                  if marker in text:
                      raise SystemExit(f'forbidden polling marker remains: {path}: {marker}')
          PY

      - name: Install
        run: npm ci

      - name: Polling guard
        run: node scripts/check-fixed-interval-polling.mjs

      - name: Frontend Core migration contract
        run: node --test workers/frontend-core-migration.test.mjs

      - name: Build
        run: npm run build

      - name: Diff check
        run: git diff --check

      - name: Commit consolidated fix
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Profile.tsx src/pages/Dashboard.tsx src/pages/DashboardQueueTv.tsx src/services/firestoreBookings.ts scripts/check-fixed-interval-polling.mjs workers/frontend-core-migration.test.mjs
          git commit -m "perf: finish fixed-interval polling removal"
          git push origin HEAD:${{ github.ref_name }}
