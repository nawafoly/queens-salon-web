name: Apply Fixed Polling Final V2

on:
  push:
    branches:
      - perf/remove-fixed-polling-final

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Apply polling consolidation
        run: python scripts/apply-fixed-polling-final.py

      - name: Install
        run: npm ci

      - name: Polling guard
        run: node scripts/check-fixed-interval-polling.mjs

      - name: Polling migration contracts
        run: >-
          node --test
          --test-name-pattern="dashboard bookings uses Core D1 without an operational Firestore switch|production dashboards refresh Core data from application events instead of fixed polling"
          workers/frontend-core-migration.test.mjs

      - name: Build
        run: npm run build

      - name: Diff check
        run: git diff --check

      - name: Commit consolidated fix
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Profile.tsx src/pages/Dashboard.tsx src/pages/DashboardQueueTv.tsx src/services/firestoreBookings.ts scripts/check-fixed-interval-polling.mjs workers/frontend-core-migration.test.mjs
          git commit -m "perf: finish fixed-interval polling removal"
          git push origin HEAD:${{ github.ref_name }}
