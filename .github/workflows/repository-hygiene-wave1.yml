name: Repository Hygiene Wave 1

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/repository-hygiene-wave1.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prove references and remove wave 1 artifacts
        run: node scripts/repository-hygiene-wave1.mjs

      - name: Repository hygiene guard
        run: npm run check:repo-hygiene

      - name: Internal booking contract
        run: npm run check:booking-internal-contract

      - name: No legacy booking runtime guard
        run: node scripts/check-no-legacy-booking-runtime.mjs

      - name: Dashboard V2 gate
        run: npm run check:dashboard-v2

      - name: Build
        run: npm run build

      - name: Diff check
        run: git diff --check

      - name: Commit wave 1 cleanup
        shell: bash
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "No cleanup changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Clean obsolete repository patch artifacts"
          git push origin HEAD:main
