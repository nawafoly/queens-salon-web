name: Employee Overview Visual Review Fix Temp

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/employee-overview-visual-review-fix-temp.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: employee-overview-visual-review-fix-main
  cancel-in-progress: false

jobs:
  refine:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact lockfile
        run: npm ci

      - name: Apply screenshot review fixes
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');

          function replaceOnce(source, from, to, label) {
            if (!source.includes(from)) throw new Error(`Missing ${label}`);
            return source.replace(from, to);
          }

          // 1) Overview KPI layout: explicit rows/columns + compact 2x2 mobile grid.
          {
            const p = 'src/styles/dashboard-v2/pages/employee-portal-overview.css';
            let s = fs.readFileSync(p, 'utf8');

            const oldCard = `.dashboard-v2 .employee-overview-v2-page .employee-overview-kpi {\n  position: relative;\n  display: grid;\n  grid-template-columns: minmax(0, 1fr) auto;\n  align-items: center;\n  gap: var(--dsv2-space-2);\n  min-width: 0;\n  min-height: 112px;\n  padding: var(--dsv2-card-padding);\n  overflow: hidden;\n  border: 1px solid var(--dsv2-border);\n  border-radius: var(--dsv2-radius-lg);\n  background: var(--dsv2-surface);\n  color: var(--dsv2-text);\n  box-shadow: var(--dsv2-shadow-xs);\n  text-decoration: none;\n  transition: border-color var(--dsv2-transition-fast), transform var(--dsv2-transition-fast), box-shadow var(--dsv2-transition-fast);\n}`;
            const newCard = `.dashboard-v2 .employee-overview-v2-page .employee-overview-kpi {\n  position: relative;\n  display: grid;\n  grid-template-columns: minmax(0, 1fr) 48px;\n  grid-template-rows: auto auto;\n  align-items: center;\n  column-gap: var(--dsv2-space-3);\n  row-gap: var(--dsv2-space-1);\n  min-width: 0;\n  min-height: 104px;\n  padding: var(--dsv2-card-padding);\n  overflow: hidden;\n  border: 1px solid var(--dsv2-border);\n  border-radius: var(--dsv2-radius-lg);\n  background: var(--dsv2-surface);\n  color: var(--dsv2-text);\n  box-shadow: var(--dsv2-shadow-xs);\n  text-decoration: none;\n  transition: border-color var(--dsv2-transition-fast), transform var(--dsv2-transition-fast), box-shadow var(--dsv2-transition-fast);\n}`;
            s = replaceOnce(s, oldCard, newCard, 'overview KPI card block');

            const oldIcon = `.dashboard-v2 .employee-overview-v2-page .employee-overview-kpi > svg {\n  grid-column: 2;\n  grid-row: 1 / span 2;\n  width: 22px;\n  height: 22px;\n  padding: var(--dsv2-space-3);\n  box-sizing: content-box;\n  border-radius: var(--dsv2-radius-md);\n  background: var(--dsv2-gold-soft);\n  color: var(--dsv2-gold);\n}`;
            const newIcon = `.dashboard-v2 .employee-overview-v2-page .employee-overview-kpi > svg {\n  grid-column: 2;\n  grid-row: 1 / 3;\n  justify-self: center;\n  width: 22px;\n  height: 22px;\n  padding: var(--dsv2-space-3);\n  box-sizing: content-box;\n  border-radius: var(--dsv2-radius-md);\n  background: var(--dsv2-gold-soft);\n  color: var(--dsv2-gold);\n}`;
            s = replaceOnce(s, oldIcon, newIcon, 'overview KPI icon block');

            const oldLabel = `.dashboard-v2 .employee-overview-v2-page .employee-overview-kpi > span {\n  align-self: end;\n  color: var(--dsv2-muted);\n  font-size: 0.67rem;\n  font-weight: 800;\n}`;
            const newLabel = `.dashboard-v2 .employee-overview-v2-page .employee-overview-kpi > span {\n  grid-column: 1;\n  grid-row: 1;\n  align-self: end;\n  min-width: 0;\n  color: var(--dsv2-muted);\n  font-size: 0.67rem;\n  font-weight: 800;\n  line-height: 1.45;\n}`;
            s = replaceOnce(s, oldLabel, newLabel, 'overview KPI label block');

            const oldValue = `.dashboard-v2 .employee-overview-v2-page .employee-overview-kpi > strong {\n  align-self: start;\n  color: var(--dsv2-text);\n  font-size: 1.7rem;\n  font-weight: 950;\n  line-height: 1;\n}`;
            const newValue = `.dashboard-v2 .employee-overview-v2-page .employee-overview-kpi > strong {\n  grid-column: 1;\n  grid-row: 2;\n  align-self: start;\n  justify-self: start;\n  color: var(--dsv2-text);\n  font-size: 1.5rem;\n  font-weight: 950;\n  line-height: 1;\n}`;
            s = replaceOnce(s, oldValue, newValue, 'overview KPI value block');

            const oldMobile = `@media (max-width: 560px) {\n  .dashboard-v2 .employee-overview-v2-page .employee-overview-kpis {\n    grid-template-columns: minmax(0, 1fr);\n  }\n\n  .dashboard-v2 .employee-overview-v2-page .employee-overview-kpi {\n    min-height: 92px;\n  }`;
            const newMobile = `@media (max-width: 560px) {\n  .dashboard-v2 .employee-overview-v2-page .employee-overview-kpis {\n    grid-template-columns: repeat(2, minmax(0, 1fr));\n    gap: var(--dsv2-space-3);\n  }\n\n  .dashboard-v2 .employee-overview-v2-page .employee-overview-kpi {\n    grid-template-columns: minmax(0, 1fr) 44px;\n    min-height: 94px;\n    padding: var(--dsv2-space-4);\n  }\n\n  .dashboard-v2 .employee-overview-v2-page .employee-overview-kpi > svg {\n    width: 19px;\n    height: 19px;\n    padding: var(--dsv2-space-2);\n  }\n\n  .dashboard-v2 .employee-overview-v2-page .employee-overview-kpi > span {\n    font-size: 0.61rem;\n  }\n\n  .dashboard-v2 .employee-overview-v2-page .employee-overview-kpi > strong {\n    font-size: 1.25rem;\n  }`;
            s = replaceOnce(s, oldMobile, newMobile, 'overview KPI mobile block');

            if (!s.includes('@media (max-width: 360px) {\n  .dashboard-v2 .employee-overview-v2-page .employee-overview-kpis')) {
              s += `\n\n@media (max-width: 360px) {\n  .dashboard-v2 .employee-overview-v2-page .employee-overview-kpis {\n    grid-template-columns: minmax(0, 1fr);\n  }\n}\n`;
            }

            fs.writeFileSync(p, s);
          }

          // 2) Mobile FAB: keep the action but stop covering cards.
          {
            const p = 'src/styles/EmployeePortalMobileNav.css';
            let s = fs.readFileSync(p, 'utf8');
            const oldFab = `  .employee-portal.madan-employee-portal\n    .employee-floating-request {\n    position: fixed !important;\n    z-index: 310;\n\n    right: auto !important;\n    left: 17px !important;\n    bottom:\n      calc(\n        85px +\n        env(safe-area-inset-bottom, 0px)\n      ) !important;\n\n    display: flex !important;\n\n    min-height: 48px;\n\n    align-items: center;\n    gap: 8px;\n\n    padding: 0 15px !important;\n\n    border: 1px solid #081432 !important;\n    border-radius: 15px !important;\n\n    color: #ffffff !important;\n    background:\n      linear-gradient(\n        135deg,\n        #071132,\n        #111c3e\n      ) !important;\n\n    box-shadow:\n      0 15px 32px rgba(7, 17, 50, 0.24) !important;\n  }`;
            const newFab = `  .employee-portal.madan-employee-portal\n    .employee-floating-request {\n    position: fixed !important;\n    z-index: 310;\n\n    right: auto !important;\n    left: 14px !important;\n    bottom:\n      calc(\n        84px +\n        env(safe-area-inset-bottom, 0px)\n      ) !important;\n\n    display: grid !important;\n    width: 50px !important;\n    min-width: 50px !important;\n    height: 50px !important;\n    min-height: 50px !important;\n    place-items: center;\n\n    padding: 0 !important;\n\n    border: 1px solid #081432 !important;\n    border-radius: 50% !important;\n\n    color: #ffffff !important;\n    background:\n      linear-gradient(\n        135deg,\n        #071132,\n        #111c3e\n      ) !important;\n\n    box-shadow:\n      0 13px 28px rgba(7, 17, 50, 0.22) !important;\n  }\n\n  .employee-portal.madan-employee-portal\n    .employee-floating-request svg {\n    font-size: 1rem;\n  }\n\n  .employee-portal.madan-employee-portal\n    .employee-floating-request span {\n    display: none;\n  }`;
            s = replaceOnce(s, oldFab, newFab, 'employee mobile FAB block');

            const oldScrollPadding = `    padding:\n      0\n      0\n      26px !important;`;
            const newScrollPadding = `    padding:\n      0\n      0\n      92px !important;`;
            s = replaceOnce(s, oldScrollPadding, newScrollPadding, 'employee route scroll bottom padding');
            fs.writeFileSync(p, s);
          }

          // 3) Employee mobile header: icon-only portal switcher, no clipped labels.
          {
            const p = 'src/styles/InternalPortalSwitcher.css';
            let s = fs.readFileSync(p, 'utf8');
            const marker = `  .employee-app-topbar__actions > .internal-portal-switcher {\n    flex: 0 0 auto;\n  }`;
            const replacement = `  .employee-app-topbar__actions > .internal-portal-switcher {\n    flex: 0 0 auto;\n  }\n\n  .employee-portal.madan-employee-portal\n    .employee-app-topbar__actions\n    .internal-portal-switcher__item span {\n    display: none;\n  }`;
            s = replaceOnce(s, marker, replacement, 'employee portal switcher integration marker');
            fs.writeFileSync(p, s);
          }

          // 4) Keep the compact FAB accessible after hiding its visible label.
          {
            const p = 'src/pages/EmployeePortal.tsx';
            let s = fs.readFileSync(p, 'utf8');
            const old = `          className="employee-floating-request"\n          onClick={() => setRequestSheetOpen(true)}\n        >`;
            const next = `          className="employee-floating-request"\n          onClick={() => setRequestSheetOpen(true)}\n          aria-label="إنشاء طلب جديد"\n          title="طلب جديد"\n        >`;
            s = replaceOnce(s, old, next, 'employee floating request button');
            fs.writeFileSync(p, s);
          }

          // Remove this one-shot workflow before hygiene/build validation and final commit.
          fs.rmSync('.github/workflows/employee-overview-visual-review-fix-temp.yml');
          NODE

      - name: Employee overview V2 contract
        run: npm run check:employee-portal-overview-v2

      - name: Dashboard V2 contract
        run: npm run check:dashboard-v2

      - name: Repository hygiene guard
        run: npm run check:repo-hygiene

      - name: Build
        run: npm run build

      - name: Diff check
        run: git diff --check

      - name: Verify scoped diff
        shell: bash
        run: |
          set -euo pipefail
          allowed='^(src/pages/EmployeePortal\.tsx|src/styles/EmployeePortalMobileNav\.css|src/styles/InternalPortalSwitcher\.css|src/styles/dashboard-v2/pages/employee-portal-overview\.css|\.github/workflows/employee-overview-visual-review-fix-temp\.yml)$'
          changed="$(git status --short | awk '{print $2}' | sort -u)"
          echo "$changed"
          unexpected="$(printf '%s\n' "$changed" | grep -Ev "$allowed" || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected files changed:"
            echo "$unexpected"
            exit 1
          fi

      - name: Promote screenshot review fixes
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refine employee overview mobile visual review"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
