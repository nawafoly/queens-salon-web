name: Employee Overview Runtime Finalize Temp

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/employee-overview-runtime-finalize-temp.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install exact lockfile
        run: npm ci

      - name: Repair finalizer helpers and anchors
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/employee-overview-runtime-finalize-temp.py")
          text = path.read_text(encoding="utf-8")

          old = "result, count = re.subn(pattern, replacement, text, count=1, flags=flags)"
          new = "result, count = re.subn(pattern, lambda _: replacement, text, count=1, flags=flags)"
          if text.count(old) != 1:
              raise SystemExit("regex helper repair anchor missing")
          text = text.replace(old, new, 1)

          label = "'make Core leave failure explicit'"
          label_pos = text.find(label)
          if label_pos < 0:
              raise SystemExit("Core leave replacement label missing")
          call_start = text.rfind("overview = regex_once(", 0, label_pos)
          call_end = text.find("\n)\n", label_pos)
          if call_start < 0 or call_end < 0:
              raise SystemExit("Core leave regex call boundaries missing")
          call_end += 3

          replacement = r'''leave_effect_start_marker = ''' + repr('''  useEffect(() => {\n    if (!session.uid) {\n      setEmployeeLeaveRequests([]);\n      return;\n    }\n\n    let alive = true;\n\n    async function loadEmployeeLeaveRequests() {''') + r'''
          leave_effect_end_marker = ''' + repr('''\n\n  useEffect(() => {\n    let alive = true;\n\n    async function loadEmployeeTarget() {''') + r'''
          leave_effect_start = overview.find(leave_effect_start_marker)
          leave_effect_end = overview.find(leave_effect_end_marker, leave_effect_start)
          if leave_effect_start < 0 or leave_effect_end < 0:
              raise SystemExit('Core leave effect boundaries missing')
          canonical_leave_effect = ''' + repr('''  useEffect(() => {\n    if (!session.uid || !attendanceEmployeeId) {\n      setEmployeeLeaveRequests([]);\n      setEmployeeLeaveLoading(false);\n      setEmployeeLeaveError("");\n      return;\n    }\n\n    let alive = true;\n\n    async function loadEmployeeLeaveRequests() {\n      setEmployeeLeaveLoading(true);\n      setEmployeeLeaveError("");\n      try {\n        const rows = await CoreHrService.listLeaves({ employeeId: attendanceEmployeeId });\n        if (alive) setEmployeeLeaveRequests(rows.map((row) => ({\n          id: row.id,\n          employeeUid: String(row.employeeUid || session.uid),\n          employeeId: row.employeeId,\n          type: row.leaveType as EmployeeLeaveRequest["type"],\n          fromDate: row.startDate,\n          toDate: row.endDate,\n          days: row.daysCount,\n          note: row.employeeNote || undefined,\n          status: row.status as EmployeeLeaveRequest["status"],\n          createdAt: row.createdAt,\n          updatedAt: row.updatedAt,\n          durationKind: row.durationKind,\n        } as EmployeeLeaveRequest & { durationKind?: string })));\n      } catch (error) {\n        if (alive) {\n          setEmployeeLeaveRequests([]);\n          setEmployeeLeaveError(\n            cleanText((error as any)?.message || "تعذر تحميل الإجازات المعتمدة من النظام المركزي.")\n          );\n        }\n      } finally {\n        if (alive) setEmployeeLeaveLoading(false);\n      }\n    }\n\n    void loadEmployeeLeaveRequests();\n\n    return () => {\n      alive = false;\n    };\n  }, [attendanceEmployeeId, session.uid]);''') + r'''
          overview = overview[:leave_effect_start] + canonical_leave_effect + overview[leave_effect_end:]
'''
          text = text[:call_start] + replacement + text[call_end:]
          path.write_text(text, encoding="utf-8")
          PY

      - name: Apply employee overview runtime finalization
        run: python scripts/employee-overview-runtime-finalize-temp.py

      - name: Remove temporary execution files
        run: |
          rm .github/workflows/employee-overview-runtime-finalize-temp.yml
          rm scripts/employee-overview-runtime-finalize-temp.py

      - name: Employee overview V2 contract
        run: npm run check:employee-portal-overview-v2

      - name: Dashboard V2 contract
        run: npm run check:dashboard-v2

      - name: HR D1-only guard
        run: npm run check:hr:d1-only

      - name: HR worker tests
        run: npm run test:hr:worker

      - name: Repository hygiene guard
        run: npm run check:repo-hygiene

      - name: Build
        run: npm run build

      - name: Diff check
        run: git diff --check

      - name: Verify scoped diff
        shell: bash
        run: |
          mapfile -t changed < <(git diff --name-only HEAD)
          printf '%s\n' "${changed[@]}"
          allowed='^(src/pages/hr/EmployeeOverview\.tsx|src/styles/dashboard-v2/pages/employee-portal-overview\.css|scripts/check-employee-portal-overview-v2\.mjs|scripts/employee-overview-runtime-finalize-temp\.py|\.github/workflows/employee-overview-runtime-finalize-temp\.yml)$'
          for file in "${changed[@]}"; do
            [[ "$file" =~ $allowed ]] || { echo "Unexpected changed file: $file"; exit 1; }
          done
          [[ ${#changed[@]} -eq 5 ]] || { echo "Expected exactly 5 scoped changes"; exit 1; }

      - name: Promote finalized employee overview
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/hr/EmployeeOverview.tsx src/styles/dashboard-v2/pages/employee-portal-overview.css scripts/check-employee-portal-overview-v2.mjs scripts/employee-overview-runtime-finalize-temp.py .github/workflows/employee-overview-runtime-finalize-temp.yml
          git commit -m "Finalize employee overview V2 runtime"
          git push origin HEAD:main
