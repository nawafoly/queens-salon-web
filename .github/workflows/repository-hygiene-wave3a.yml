name: Repository Hygiene Wave 3A

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/repository-hygiene-wave3a.yml"

permissions:
  contents: write

jobs:
  retire-one-time-mutations:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Align frontend migration contract with removed legacy entrypoint
        run: |
          node <<'NODE'
          const fs = require('fs');

          const guardPath = 'scripts/check-frontend-core-migration.mjs';
          let guard = fs.readFileSync(guardPath, 'utf8');
          guard = guard.replace(
            'import { readFileSync } from "node:fs";',
            'import { existsSync, readFileSync } from "node:fs";'
          );
          const forbiddenLegacy = `  {
            file: "src/pages/BookingInternal.tsx",
            forbidden: [
              /from\\s+["']\\.\\.\\/services\\/firestoreBookings["']/,
              /import\\s+\\*\\s+as\\s+firestoreBookings/,
              /collection\\([^\\n]*["']booking_slots["']/,
              /doc\\([^\\n]*["']availability_days["']/,
            ],
          },
          `;
          if (!guard.includes(forbiddenLegacy)) throw new Error('stale forbidden BookingInternal contract block not found');
          guard = guard.replace(forbiddenLegacy, '');
          const requiredLegacy = `  {
            file: "src/pages/BookingInternal.tsx",
            required: [/BookingInternalV2/],
          },
          `;
          if (!guard.includes(requiredLegacy)) throw new Error('stale required BookingInternal contract block not found');
          guard = guard.replace(requiredLegacy, '');
          const failureMarker = 'const failures = [];';
          if (!guard.includes('historical BookingInternal wrapper must remain deleted')) {
            guard = guard.replace(
              failureMarker,
              `${failureMarker}\nif (existsSync("src/pages/BookingInternal.tsx")) {\n  failures.push("src/pages/BookingInternal.tsx: historical BookingInternal wrapper must remain deleted");\n}`
            );
          }
          fs.writeFileSync(guardPath, guard, 'utf8');

          const testPath = 'workers/frontend-core-migration.test.mjs';
          let tests = fs.readFileSync(testPath, 'utf8');
          tests = tests.replace(
            'import { readFileSync } from "node:fs";',
            'import { existsSync, readFileSync } from "node:fs";'
          );
          const legacyAvailability = `
            const legacyEntry = readFileSync("src/pages/BookingInternal.tsx", "utf8");
            assert.match(legacyEntry, /BookingInternalV2/);
            assert.doesNotMatch(legacyEntry, /\\bgetStaffAvailability\\s*\\(/);
            assert.doesNotMatch(legacyEntry, /from\\s+["'][^"']*(staffAvailability|firestoreAvailabilityBackfill)/);
          `;
          if (!tests.includes(legacyAvailability)) throw new Error('stale BookingInternal availability assertion not found');
          tests = tests.replace(
            legacyAvailability,
            `
            assert.equal(existsSync("src/pages/BookingInternal.tsx"), false, "historical BookingInternal wrapper must stay deleted");
          `
          );
          const legacyRefund = `  const dashboard = readFileSync("src/pages/DashboardBookings.tsx", "utf8");
            const internal = readFileSync("src/pages/BookingInternal.tsx", "utf8");

            assert.match(dashboard, /CoreRefundService/);`;
          if (!tests.includes(legacyRefund)) throw new Error('stale BookingInternal refund assertion setup not found');
          tests = tests.replace(
            legacyRefund,
            `  const dashboard = readFileSync("src/pages/DashboardBookings.tsx", "utf8");
            const internalV2 = readFileSync("src/features/internal-booking-v2/BookingInternalV2.tsx", "utf8");

            assert.match(dashboard, /CoreRefundService/);`
          );
          const legacyRefundAssertions = `
            assert.match(internal, /BookingInternalV2/);
            assert.doesNotMatch(internal, /CoreRefundService|getDataSourceFlags/);
          `;
          if (!tests.includes(legacyRefundAssertions)) throw new Error('stale BookingInternal refund assertions not found');
          tests = tests.replace(
            legacyRefundAssertions,
            `
            assert.equal(existsSync("src/pages/BookingInternal.tsx"), false, "legacy internal booking entrypoint must stay deleted");
            assert.doesNotMatch(internalV2, /CoreRefundService|getDataSourceFlags/);
          `
          );
          fs.writeFileSync(testPath, tests, 'utf8');
          console.log('frontend migration contracts aligned with V2-only internal booking');
          NODE

      - name: Retire inspected mutation workflows and unreferenced scripts
        run: node scripts/repository-hygiene-wave3a.mjs

      - name: Repository hygiene guard
        run: npm run check:repo-hygiene

      - name: Booking runtime audit
        run: node scripts/audit-legacy-booking-runtime.mjs --fail-on-high-risk

      - name: No-legacy booking runtime guard
        run: node scripts/check-no-legacy-booking-runtime.mjs

      - name: Internal booking contract
        run: npm run check:booking-internal-contract

      - name: Dashboard V2 gate
        run: npm run check:dashboard-v2

      - name: Build
        run: npm run build

      - name: Core worker tests
        run: npm run test:core:worker

      - name: HR worker tests
        run: npm run test:hr:worker

      - name: Frontend Core migration tests
        run: npm run test:frontend:core

      - name: Diff check
        run: git diff --check

      - name: Commit wave 3A cleanup
        shell: bash
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "No wave 3A cleanup changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Retire obsolete repository mutation workflows"
          git push origin HEAD:main
