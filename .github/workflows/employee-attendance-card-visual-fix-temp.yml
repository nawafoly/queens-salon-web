name: Employee Attendance Card Visual Fix Temp

on:
  push:
    paths:
      - ".github/workflows/employee-attendance-card-visual-fix-temp.yml"

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact lockfile
        run: npm ci

      - name: Apply approved compact attendance card
        run: python scripts/employee-attendance-card-visual-fix-temp.py

      - name: Remove temporary execution files
        run: |
          rm .github/workflows/employee-attendance-card-visual-fix-temp.yml
          rm scripts/employee-attendance-card-visual-fix-temp.py

      - name: Employee overview V2 contract
        run: npm run check:employee-portal-overview-v2

      - name: Dashboard V2 contract
        run: npm run check:dashboard-v2

      - name: Repository hygiene guard
        run: npm run check:repo-hygiene

      - name: Build
        run: npm run build

      - name: Diff check
        run: git diff --check

      - name: Verify scoped diff
        shell: bash
        run: |
          mapfile -t changed < <(git diff --name-only HEAD)
          printf '%s\n' "${changed[@]}"
          allowed='^(src/pages/hr/EmployeeOverview\.tsx|src/styles/dashboard-v2/pages/employee-portal-overview\.css|scripts/employee-attendance-card-visual-fix-temp\.py|\.github/workflows/employee-attendance-card-visual-fix-temp\.yml)$'
          for file in "${changed[@]}"; do
            [[ "$file" =~ $allowed ]] || { echo "Unexpected changed file: $file"; exit 1; }
          done
          [[ ${#changed[@]} -eq 4 ]] || { echo "Expected exactly 4 scoped changes"; exit 1; }

      - name: Promote attendance card visual fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/hr/EmployeeOverview.tsx src/styles/dashboard-v2/pages/employee-portal-overview.css scripts/employee-attendance-card-visual-fix-temp.py .github/workflows/employee-attendance-card-visual-fix-temp.yml
          git commit -m "Restore compact employee attendance card"
          git push origin HEAD:main
