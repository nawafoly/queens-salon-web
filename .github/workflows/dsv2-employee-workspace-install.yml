name: Install and verify employee workspace V2

on:
  push:
    branches:
      - refactor/dashboard-design-system-v2
    paths:
      - ".github/workflows/dsv2-employee-workspace-install.yml"

permissions:
  contents: write

jobs:
  install-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout design-system branch
        uses: actions/checkout@v4
        with:
          ref: refactor/dashboard-design-system-v2
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install employee workspace payload
        shell: bash
        run: |
          set -euo pipefail
          cat .github/dsv2-employee-workspace-payload/part-* > /tmp/dsv2-workspace.tar.gz.b64
          printf '%s  %s\n' '1dca38673eb8d37068a798d2ccca8a7707cd65170c428011d235d257fafd6506' '/tmp/dsv2-workspace.tar.gz.b64' | sha256sum --check
          base64 --decode /tmp/dsv2-workspace.tar.gz.b64 > /tmp/dsv2-workspace.tar.gz
          printf '%s  %s\n' 'ed94196c7c8182cbc06b9a7e2d1f8eb6b00d101ffe3fef865248d9f7a549610b' '/tmp/dsv2-workspace.tar.gz' | sha256sum --check
          tar -xzf /tmp/dsv2-workspace.tar.gz -C .
          test -f src/components/dashboard-v2/employee-workspace/DashboardEmployeeWorkspaceV2.tsx
          test -f src/styles/dashboard-v2/pages/employee-workspace.css

          if [ ! -f src/pages/DashboardDesignSystemFoundationV2.tsx ]; then
            cp src/pages/DashboardDesignSystemV2.tsx src/pages/DashboardDesignSystemFoundationV2.tsx
          fi

          cat > src/pages/DashboardDesignSystemV2.tsx <<'EOF'
          import DashboardEmployeeWorkspaceV2 from "../components/dashboard-v2/employee-workspace";
          import DashboardDesignSystemFoundationV2 from "./DashboardDesignSystemFoundationV2";

          export default function DashboardDesignSystemV2() {
            return (
              <>
                <DashboardDesignSystemFoundationV2 />
                <DashboardEmployeeWorkspaceV2 />
              </>
            );
          }
          EOF

      - name: Verify workspace contracts
        shell: bash
        run: |
          set -euo pipefail
          ROOT='src/components/dashboard-v2/employee-workspace'
          CSS='src/styles/dashboard-v2/pages/employee-workspace.css'

          if grep -RIn '<select' "$ROOT"; then
            echo 'Native select is prohibited.'
            exit 1
          fi
          if grep -RIn 'type="date"' "$ROOT"; then
            echo 'Native date input is prohibited.'
            exit 1
          fi

          node <<'NODE'
          const fs = require('fs');
          const source = fs.readFileSync('src/components/dashboard-v2/employee-workspace/types.ts', 'utf8');
          const expected = [
            'basic', 'profile', 'services', 'schedule', 'shifts', 'attendance',
            'payroll', 'requests', 'leaves', 'messages', 'files'
          ];
          const found = [...source.matchAll(/^\s+id:\s+"([^"]+)"/gm)].map((match) => match[1]);
          if (found.length !== 11 || expected.some((id) => !found.includes(id))) {
            throw new Error(`Employee tabs verification failed: ${JSON.stringify(found)}`);
          }
          NODE

          for component in \
            DashboardSelectV2 \
            DashboardDatePickerV2 \
            DashboardFieldV2 \
            DashboardModalV2 \
            DashboardDrawerV2 \
            DashboardConfirmV2 \
            DashboardEmptyStateV2 \
            DashboardErrorStateV2 \
            DashboardSkeletonV2; do
            grep -R "$component" "$ROOT" >/dev/null
          done

          grep -R 'dir="rtl"' "$ROOT" >/dev/null
          grep -F '@media (max-width:' "$CSS" >/dev/null
          grep -F '.dsv2-employee-workspace' "$CSS" >/dev/null
          grep -F 'grid-template-columns: repeat(6' "$CSS" >/dev/null
          grep -F 'DashboardEmployeeWorkspaceV2' src/pages/DashboardDesignSystemV2.tsx >/dev/null

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Commit verified workspace
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/dsv2-employee-workspace-payload
          rm -f .github/workflows/dsv2-employee-workspace-install.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: add employee workspace v2 to design system'
          git push origin HEAD:refactor/dashboard-design-system-v2
