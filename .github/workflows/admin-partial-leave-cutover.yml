name: Admin Partial Leave Cutover

on:
  push:
    branches: [main]
    paths:
      - "scripts/add-admin-partial-leave.mjs"
      - ".github/workflows/admin-partial-leave-cutover.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: admin-partial-leave-cutover-main
  cancel-in-progress: false

jobs:
  cutover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Apply partial-day leave cutover
        run: node scripts/add-admin-partial-leave.mjs

      - name: Build
        run: npm run build

      - name: Partial-day leave policy tests
        run: node --test workers/admin-partial-leave-policy.test.mjs

      - name: Core worker tests
        run: npm run test:core:worker

      - name: HR worker tests
        run: npm run test:hr:worker

      - name: Frontend Core migration guard
        run: npm run check:frontend-core-migration

      - name: Booking no-legacy architecture guard
        run: node scripts/check-no-legacy-booking-runtime.mjs

      - name: Booking runtime audit
        run: node scripts/audit-legacy-booking-runtime.mjs --fail-on-high-risk

      - name: Diff check
        run: git diff --check

      - name: Promote only after every gate is green
        shell: bash
        run: |
          set -euo pipefail
          git add \
            src/components/LeaveRequestModal.tsx \
            src/styles/LeaveRequestModal.css \
            src/services/employeeHub.ts \
            src/pages/DashboardEmployees.tsx \
            workers/core/repositories/leaves.js \
            workers/admin-partial-leave-policy.test.mjs
          if git diff --cached --quiet; then
            echo "No production changes to promote."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add partial-day leave registration"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
