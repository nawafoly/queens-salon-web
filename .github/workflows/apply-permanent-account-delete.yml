name: Apply permanent account deletion

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-permanent-account-delete.mjs'
      - '.github/workflows/apply-permanent-account-delete.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply implementation
        run: node scripts/apply-permanent-account-delete.mjs

      - name: Verify worker syntax
        run: |
          node --check workers/core/index.js
          node --check workers/core/repositories/admin-profiles.js

      - name: Install web dependencies
        run: npm ci

      - name: Build Firebase functions
        run: npm --prefix functions ci && npm --prefix functions run build

      - name: Run HR worker tests
        run: npm run test:hr:worker

      - name: Build web app
        run: npm run build

      - name: Commit final implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/apply-permanent-account-delete.mjs patches/permanent-account-delete.patch .github/workflows/apply-permanent-account-delete.yml
          git add functions/src/index.ts src/pages/settings/SettingsUsers.tsx src/services/adminAccountDeletionService.ts workers/core/index.js workers/core/repositories/admin-profiles.js
          git commit -m "Implement permanent admin account deletion"
          git push origin HEAD:main
