name: Temporary employee create success UX patch

on:
  push:
    branches:
      - fix/employee-create-success-modal-ux
    paths:
      - .github/workflows/tmp-employee-create-success-ux.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/employee-create-success-modal-ux
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply surgical UI behavior and styling patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one match in {path}, found {count}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          page = "src/pages/DashboardEmployees.tsx"

          replace_once(
              page,
              '''  const save = async () => {
    if (!ensureCanManage()) return;
    const cleanName = name.trim();''',
              '''  const save = async (options?: { createLogin?: boolean }) => {
    if (!ensureCanManage()) return;
    const isCreatingEmployee = !editId;
    const createdLogin = isCreatingEmployee && options?.createLogin === true;
    const cleanName = name.trim();''',
          )

          replace_once(
              page,
              '''      setSelectedEmployeeId(targetEmployeeId);
      setEditId(targetEmployeeId);
      setIsOpen(true);
      setMode("edit");
      if (!editId) {
        setActiveTab("basic");
        setModalTab("basic");
        navigate(`/dashboard/employees/${encodeURIComponent(targetEmployeeId)}/basic`);
      }
''',
              '''      if (!isCreatingEmployee) {
        setSelectedEmployeeId(targetEmployeeId);
        setEditId(targetEmployeeId);
        setIsOpen(true);
        setMode("edit");
      }
''',
          )

          replace_once(
              page,
              '''      openEdit(reloadedEmployee, false);
      setActiveTab(activeTabBeforeReload);
      setModalTab(
        ["basic", "profile", "services", "booking"].includes(activeTabBeforeReload)
          ? (activeTabBeforeReload as EmployeeModalTab)
          : modalTabBeforeReload
      );
      selectedEmployeeIdentityRef.current = employeeIdentityOf(reloadedEmployee);
      window.dispatchEvent(new Event("queens:staff-updated"));
      setSaveMessage(
        "\\u062a\\u0645 \\u062d\\u0641\\u0638 \\u0627\\u0644\\u062a\\u063a\\u064a\\u064a\\u0631\\u0627\\u062a \\u0628\\u0646\\u062c\\u0627\\u062d"
      );

      // Arm one baseline capture. The effect waits until saving=false and then
      // records the fully rehydrated editor render exactly once.
      setEmployeeProfileBaselineCaptureNonce(
        (nonce) => nonce + 1
      );
''',
              '''      if (isCreatingEmployee) {
        selectedEmployeeIdentityRef.current = null;
        setSelectedEmployeeId(null);
        setEditId(null);
        setIsOpen(false);
        setMode("edit");
        resetForm();
        navigate("/dashboard/employees", { replace: true });
        setSaveMessage(
          createdLogin
            ? "تم إنشاء الموظفة وحساب الدخول وربطهما بنجاح."
            : "تم إنشاء الموظفة بنجاح."
        );
      } else {
        openEdit(reloadedEmployee, false);
        setActiveTab(activeTabBeforeReload);
        setModalTab(
          ["basic", "profile", "services", "booking"].includes(activeTabBeforeReload)
            ? (activeTabBeforeReload as EmployeeModalTab)
            : modalTabBeforeReload
        );
        selectedEmployeeIdentityRef.current = employeeIdentityOf(reloadedEmployee);
        setSaveMessage("تم حفظ التغييرات بنجاح.");

        // Arm one baseline capture. The effect waits until saving=false and then
        // records the fully rehydrated editor render exactly once.
        setEmployeeProfileBaselineCaptureNonce(
          (nonce) => nonce + 1
        );
      }
      window.dispatchEvent(new Event("queens:staff-updated"));
''',
          )

          replace_once(
              page,
              '''  const [errorMsg, setErrorMsg] = useState("");
  const [saveMessage, setSaveMessage] = useState("");
  const busy = loading || saving;
''',
              '''  const [errorMsg, setErrorMsg] = useState("");
  const [saveMessage, setSaveMessage] = useState("");
  const busy = loading || saving;

  useEffect(() => {
    if (!saveMessage) return;
    const timer = window.setTimeout(() => setSaveMessage(""), 7000);
    return () => window.clearTimeout(timer);
  }, [saveMessage]);
''',
          )

          replace_once(
              page,
              '''    resetForm();
    setSelectedEmployeeId(null);
    setMode("edit");
    setIsOpen(true);''',
              '''    setSaveMessage("");
    resetForm();
    setSelectedEmployeeId(null);
    setMode("edit");
    setIsOpen(true);''',
          )

          replace_once(
              page,
              '''        {saveMessage ? (
          <div className="employees-v2-alert employees-v2-alert--success" role="status">
            {saveMessage}
          </div>
        ) : null}''',
              '''        {saveMessage ? (
          <div
            className="employees-v2-alert employees-v2-alert--success"
            role="status"
            aria-live="polite"
          >
            <strong className="employees-v2-alert__title">تمت العملية بنجاح</strong>
            <span>{saveMessage}</span>
          </div>
        ) : null}''',
          )

          css_path = Path("src/styles/dashboard-v2/pages/employees.css")
          css = css_path.read_text(encoding="utf-8")
          marker = "/* EMPLOYEE_CREATE_UNIFIED_UX_V1 */"
          if marker in css:
              raise SystemExit("Employee create UX styles already exist; refusing duplicate append.")

          css += r'''

/* EMPLOYEE_CREATE_UNIFIED_UX_V1
   Create-only refinements use the shared Dashboard V2 tokens and keep
   employee/account provisioning inside one clear visual workflow. */
.dashboard-v2 .employees-v2-alert--success {
  display: grid;
  gap: var(--dsv2-space-1);
  border-color: var(--dsv2-green-border);
  color: var(--dsv2-green);
  background: var(--dsv2-green-soft);
}

.dashboard-v2 .employees-v2-alert__title {
  color: currentColor;
  font-size: 0.8rem;
  font-weight: 950;
}

.dashboard-v2 .employees-v2-alert--success > span {
  color: var(--dsv2-text);
  font-weight: 800;
}

.dashboard-v2 .employees-v2-editor--create .dsv2-dialog__body {
  background: var(--dsv2-surface-soft);
}

.dashboard-v2 .employees-v2-editor__create-intro {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  align-items: start;
  gap: var(--dsv2-space-3);
  margin-bottom: var(--dsv2-space-4);
  padding: var(--dsv2-space-4);
  border: 1px solid var(--dsv2-border-gold);
  border-radius: var(--dsv2-radius-lg);
  background: var(--dsv2-surface);
  box-shadow: var(--dsv2-shadow-xs);
}

.dashboard-v2 .employees-v2-editor__create-intro .dsv2-badge {
  margin-top: 2px;
  white-space: nowrap;
}

.dashboard-v2 .employees-v2-editor__create-intro > div {
  display: grid;
  gap: var(--dsv2-space-1);
  min-width: 0;
}

.dashboard-v2 .employees-v2-editor__create-intro strong {
  color: var(--dsv2-text);
  font-size: 0.86rem;
  font-weight: 950;
}

.dashboard-v2 .employees-v2-editor__create-intro p {
  margin: 0;
  color: var(--dsv2-muted);
  font-size: 0.68rem;
  font-weight: 700;
  line-height: 1.75;
}

.dashboard-v2 .employees-v2-editor--create .employees-v2-editor__tabs {
  margin-bottom: var(--dsv2-space-4);
  background: var(--dsv2-surface);
}

.dashboard-v2 .employees-v2-editor--create .employees-v2-editor__tabs > button {
  min-height: 48px;
  grid-template-columns: auto minmax(0, 1fr);
  justify-content: start;
  text-align: start;
}

.dashboard-v2 .employees-v2-editor__tab-index {
  display: inline-flex;
  width: 24px;
  height: 24px;
  align-items: center;
  justify-content: center;
  border: 1px solid var(--dsv2-border);
  border-radius: var(--dsv2-radius-pill);
  color: var(--dsv2-muted);
  background: var(--dsv2-surface-soft);
  font-size: 0.62rem;
  font-weight: 950;
}

.dashboard-v2 .employees-v2-editor--create .employees-v2-editor__tabs > button.is-active .employees-v2-editor__tab-index {
  border-color: var(--dsv2-border-gold);
  color: var(--dsv2-gold-strong);
  background: var(--dsv2-gold-soft);
}

.dashboard-v2 .employees-v2-editor--create .employees-v2-editor__fieldset {
  display: grid;
  gap: var(--dsv2-space-4);
}

.dashboard-v2 .employees-v2-editor--create .employee-onboarding-account {
  margin-top: 0;
  padding: var(--dsv2-card-padding);
  border-color: var(--dsv2-border);
  border-radius: var(--dsv2-radius-lg);
  background: var(--dsv2-surface);
  box-shadow: var(--dsv2-shadow-xs);
}

.dashboard-v2 .employees-v2-editor--create .employee-onboarding-account__head {
  padding-bottom: var(--dsv2-space-3);
  border-bottom: 1px solid var(--dsv2-divider);
}

.dashboard-v2 .employees-v2-editor--create .employee-onboarding-account__head h3 {
  margin-top: var(--dsv2-space-2);
  color: var(--dsv2-text);
  font-size: 0.9rem;
}

.dashboard-v2 .employees-v2-editor--create .employee-onboarding-account__head p {
  max-width: 720px;
  color: var(--dsv2-muted);
}

.dashboard-v2 .employees-v2-editor--create .employee-onboarding-account__toggle {
  align-self: start;
  min-height: 42px;
  padding-inline: var(--dsv2-space-3);
  border: 1px solid var(--dsv2-border-gold);
  border-radius: var(--dsv2-radius-md);
  background: var(--dsv2-gold-softer);
}

.dashboard-v2 .employees-v2-editor--create .employee-onboarding-account__grid {
  margin-top: var(--dsv2-space-4);
  gap: var(--dsv2-field-gap);
}

@media (max-width: 760px) {
  .dashboard-v2 .employees-v2-editor__create-intro {
    grid-template-columns: 1fr;
  }

  .dashboard-v2 .employees-v2-editor--create .employees-v2-editor__tabs {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .dashboard-v2 .employees-v2-editor--create .employee-onboarding-account__head {
    align-items: stretch;
  }

  .dashboard-v2 .employees-v2-editor--create .employee-onboarding-account__toggle {
    width: 100%;
    justify-content: space-between;
  }
}

@media (max-width: 520px) {
  .dashboard-v2 .employees-v2-editor--create .employees-v2-editor__tabs {
    grid-template-columns: 1fr;
  }
}
'''
          css_path.write_text(css, encoding="utf-8")

          workflow = Path(".github/workflows/tmp-employee-create-success-ux.yml")
          workflow.unlink()
          PY

      - name: Install dependencies
        run: npm ci

      - name: Verify focused UX guard
        run: node scripts/check-employee-create-success-ux.mjs

      - name: Verify unified onboarding guard
        run: node scripts/check-dashboard-create-staff-v2.mjs

      - name: Build
        run: npm run build

      - name: Commit verified patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(hr): close employee create dialog after verified success"
          git push origin HEAD:fix/employee-create-success-modal-ux
