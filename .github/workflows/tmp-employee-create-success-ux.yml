name: Temporary employee create success UX patch

on:
  push:
    branches:
      - fix/employee-create-success-modal-ux
    paths:
      - .github/workflows/tmp-employee-create-success-ux.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/employee-create-success-modal-ux
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply surgical patch
        run: python scripts/apply-employee-create-success-ux.py

      - name: Install dependencies
        run: npm ci

      - name: Verify focused UX guard
        run: node scripts/check-employee-create-success-ux.mjs

      - name: Verify unified onboarding guard
        run: node scripts/check-dashboard-create-staff-v2.mjs

      - name: Build
        run: npm run build

      - name: Commit verified patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(hr): close employee create dialog after verified success"
          git push origin HEAD:fix/employee-create-success-modal-ux
