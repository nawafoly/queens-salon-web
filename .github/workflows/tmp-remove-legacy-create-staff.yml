name: Temporary legacy create-staff cleanup

on:
  push:
    branches:
      - fix/remove-legacy-d1-create-entry
    paths:
      - .github/workflows/tmp-remove-legacy-create-staff.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/remove-legacy-d1-create-entry
          fetch-depth: 0

      - name: Remove retired route without rewriting unrelated code
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str = ""):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one match in {path}, found {count}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "src/pages/AdminHrDashboard.tsx",
              'import CreateStaffAccountPage from "./hr/CreateStaffAccount";\n',
          )

          replace_once(
              "src/pages/AdminHrDashboard.tsx",
              '''              <button className="hr-overview-v2__action-card" type="button" onClick={() => onNavigate("/dashboard/create-staff")}>
                <FontAwesomeIcon icon={faPlus} />
                <strong>إنشاء حساب</strong>
                <span>إنشاء حساب موظفة وربطه بالملف الوظيفي.</span>
              </button>
''',
          )

          replace_once(
              "src/pages/AdminHrDashboard.tsx",
              '''            <Route
              path="create-staff"
              element={
                <PermissionRoute allOf={["admin_accounts.manage", "employees.create"]}>
                  <CreateStaffAccountPage session={session} />
                </PermissionRoute>
              }
            />
''',
          )

          replace_once("src/pages/Dashboard.tsx", '  "create-staff",\n')
          replace_once("src/pages/Dashboard.tsx", '  "create-staff": "إنشاء حساب موظفة",\n')

          for path in [
              Path("src/pages/hr/CreateStaffAccount.tsx"),
              Path("src/pages/hr/CreateStaffAccountV2.tsx"),
          ]:
              if not path.exists():
                  raise SystemExit(f"Expected retired file to exist before cleanup: {path}")
              path.unlink()

          workflow = Path(".github/workflows/tmp-remove-legacy-create-staff.yml")
          if workflow.exists():
              workflow.unlink()
          PY

      - name: Verify cutover guard
        run: node scripts/check-dashboard-create-staff-v2.mjs

      - name: Commit surgical cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(hr): remove retired create-staff route [legacy-create-staff-cleanup]"
          git push origin HEAD:fix/remove-legacy-d1-create-entry
