name: Temporary Dashboard Staff Core Cutover

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'fix/dashboard-staff-core-cutover'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/dashboard-staff-core-cutover
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Patch Core route
        run: echo '' | base64 -d | python
      - name: Verify syntax
        run: node --check workers/core/index.js && node --check workers/core/repositories/booking-staff-portal.js
      - name: Commit Core route and remove temporary workflow
        run: |
          rm .github/workflows/tmp-dashboard-staff-core-cutover.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add workers/core/index.js .github/workflows/tmp-dashboard-staff-core-cutover.yml
          git commit -m 'feat(core): route employee booking self-service'
          git push origin HEAD:fix/dashboard-staff-core-cutover
