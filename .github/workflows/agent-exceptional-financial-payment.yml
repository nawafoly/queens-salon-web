            if (!source) throw new Error("لم يتم العثور على نموذج الصرف المالي للطباعة.");
            const frame = document.createElement("iframe");
            frame.setAttribute("title", "طباعة طلب الصرف المالي");
            frame.style.position = "fixed";
            frame.style.width = "1px";
            frame.style.height = "1px";
            frame.style.right = "-10000px";
            frame.style.bottom = "0";
            frame.style.border = "0";
            document.body.appendChild(frame);
            const printDoc = frame.contentDocument;
            if (!printDoc) { frame.remove(); throw new Error("تعذر تجهيز نافذة الطباعة."); }
            const clone = source.cloneNode(true) as HTMLElement;
            printDoc.open();
            printDoc.write(`<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><base href="${document.baseURI}">${currentStyleNodes()}<style>${PRINT_CSS}</style></head><body>${clone.outerHTML}</body></html>`);
            printDoc.close();
            await waitForImages(printDoc);
            if ("fonts" in printDoc) { try { await printDoc.fonts.ready; } catch { /* use available fonts */ } }
            const printWindow = frame.contentWindow;
            if (!printWindow) { frame.remove(); throw new Error("تعذر فتح نافذة الطباعة."); }
            printWindow.focus();
            printWindow.print();
            window.setTimeout(() => frame.remove(), 1800);
