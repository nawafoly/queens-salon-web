name: Exceptional financial payment implementation

on:
  push:
    branches:
      - agent/exceptional-financial-payment

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/exceptional-financial-payment
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Recover and run implementation script
        shell: bash
        run: |
          git show HEAD^:.github/workflows/agent-exceptional-financial-payment.yml > /tmp/previous-workflow.yml
          python - <<'PY'
          from pathlib import Path
          import textwrap
          source = Path('/tmp/previous-workflow.yml').read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.index("\n          PY\n", start)
          script = textwrap.dedent(source[start:end])
          Path('/tmp/apply-exceptional-payment.py').write_text(script, encoding='utf-8')
          PY
          python /tmp/apply-exceptional-payment.py

      - name: Install dependencies
        run: npm ci

      - name: Run Core worker tests
        run: node --test workers/hr-core-worker.test.mjs

      - name: Build web app
        run: npm run build

      - name: Commit implementation
        shell: bash
        run: |
          git rm .github/workflows/agent-exceptional-financial-payment.yml
          git add workers/core/repositories/employee-requests.js workers/hr-core-worker.test.mjs src/services/employeeRequests.ts src/services/exceptionalFinancialPaymentRequestExport.ts src/pages/hr/EmployeeRequests.tsx src/pages/hr/AdminEmployeeRequests.tsx src/components/hr/ExceptionalFinancialPaymentRequestDocument.tsx migrations/core/0023_exceptional_financial_payment_requests.sql
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add exceptional financial payment requests"
          git push origin HEAD:agent/exceptional-financial-payment
