name: Validate exceptional financial payment implementation

on:
  push:
    branches:
      - agent/exceptional-financial-payment

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/exceptional-financial-payment
          fetch-depth: 4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply implementation in runner
        shell: bash
        run: |
          git show 0c755c48e9d57894a50fc6acd3a9d26d6be2b109:.github/workflows/agent-exceptional-financial-payment.yml > /tmp/original-workflow.yml
          python - <<'PY'
          from pathlib import Path
          source = Path('/tmp/original-workflow.yml').read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.index("\n          PY\n", start)
          block = source[start:end]
          script = "\n".join(line[10:] if line.startswith("          ") else line for line in block.splitlines()) + "\n"
          Path('/tmp/apply-exceptional-payment.py').write_text(script, encoding='utf-8')
          PY
          python /tmp/apply-exceptional-payment.py
          python - <<'PY'
          from pathlib import Path
          p = Path('src/pages/hr/EmployeePayroll.tsx')
          text = p.read_text(encoding='utf-8-sig')
          text = text.replace(
              'useState<EmployeeRequestPayrollImpact>({ overtime: [], advances: [], installments: [] })',
              'useState<EmployeeRequestPayrollImpact>({ overtime: [], advances: [], installments: [], financialPayments: [] })',
              1,
          )
          text = text.replace(
              'getMyEmployeeRequestPayrollImpact().catch(() => ({ overtime: [], advances: [], installments: [] }))',
              'getMyEmployeeRequestPayrollImpact().catch(() => ({ overtime: [], advances: [], installments: [], financialPayments: [] }))',
              1,
          )
          p.write_text(text, encoding='utf-8')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Run Core worker tests
        run: node --test workers/hr-core-worker.test.mjs

      - name: Build web app
        run: npm run build

      - name: Collect validated files
        shell: bash
        run: |
          mkdir -p /tmp/validated
          cp --parents workers/core/repositories/employee-requests.js workers/hr-core-worker.test.mjs src/services/employeeRequests.ts src/services/exceptionalFinancialPaymentRequestExport.ts src/pages/hr/EmployeeRequests.tsx src/pages/hr/AdminEmployeeRequests.tsx src/pages/hr/EmployeePayroll.tsx src/components/hr/ExceptionalFinancialPaymentRequestDocument.tsx migrations/core/0023_exceptional_financial_payment_requests.sql /tmp/validated/

      - uses: actions/upload-artifact@v4
        with:
          name: exceptional-financial-payment-validated
          path: /tmp/validated
          if-no-files-found: error
