name: Finalize exceptional financial payment implementation

on:
  push:
    branches:
      - agent/exceptional-financial-payment

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/exceptional-financial-payment
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply previously validated implementation
        shell: bash
        run: |
          git show 0c755c48e9d57894a50fc6acd3a9d26d6be2b109:.github/workflows/agent-exceptional-financial-payment.yml > /tmp/original-workflow.yml
          python - <<'PY'
          from pathlib import Path
          source = Path('/tmp/original-workflow.yml').read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.index("\n          PY\n", start)
          block = source[start:end]
          script = "\n".join(line[10:] if line.startswith("          ") else line for line in block.splitlines()) + "\n"
          Path('/tmp/apply-exceptional-payment.py').write_text(script, encoding='utf-8')
          PY
          python /tmp/apply-exceptional-payment.py
          python - <<'PY'
          from pathlib import Path
          p = Path('src/pages/hr/EmployeePayroll.tsx')
          text = p.read_text(encoding='utf-8-sig')
          text = text.replace(
              'useState<EmployeeRequestPayrollImpact>({ overtime: [], advances: [], installments: [] })',
              'useState<EmployeeRequestPayrollImpact>({ overtime: [], advances: [], installments: [], financialPayments: [] })',
              1,
          )
          text = text.replace(
              'getMyEmployeeRequestPayrollImpact().catch(() => ({ overtime: [], advances: [], installments: [] }))',
              'getMyEmployeeRequestPayrollImpact().catch(() => ({ overtime: [], advances: [], installments: [], financialPayments: [] }))',
              1,
          )
          p.write_text(text, encoding='utf-8')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Test Core
        run: node --test workers/hr-core-worker.test.mjs

      - name: Build
        run: npm run build

      - name: Commit validated implementation and remove temporary workflow
        shell: bash
        run: |
          git rm .github/workflows/agent-exceptional-financial-payment.yml
          git add migrations/core/0023_exceptional_financial_payment_requests.sql src/components/hr/ExceptionalFinancialPaymentRequestDocument.tsx src/pages/hr/AdminEmployeeRequests.tsx src/pages/hr/EmployeePayroll.tsx src/pages/hr/EmployeeRequests.tsx src/services/employeeRequests.ts src/services/exceptionalFinancialPaymentRequestExport.ts workers/core/repositories/employee-requests.js workers/hr-core-worker.test.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add exceptional financial payment requests"
          git push origin HEAD:agent/exceptional-financial-payment
