name: Apply exceptional financial payment implementation

on:
  push:
    branches:
      - agent/exceptional-financial-payment

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/exceptional-financial-payment
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply implementation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8-sig')
              if old not in text:
                  raise SystemExit(f'Anchor not found in {path}: {old[:100]!r}')
              text = text.replace(old, new, 1)
              p.write_text(text, encoding='utf-8')

          # ------------------------------------------------------------------
          # Core request runtime
          # ------------------------------------------------------------------
          worker = 'workers/core/repositories/employee-requests.js'
          replace_once(worker,
          "  'salary_advance',\n  'leave',",
          "  'salary_advance',\n  'exceptional_financial_payment',\n  'leave',")
          replace_once(worker,
          "  salary_advance: 'ADV',\n  leave: 'LEV',",
          "  salary_advance: 'ADV',\n  exceptional_financial_payment: 'EFP',\n  leave: 'LEV',")
          replace_once(worker,
          "  salary_advance: 'صرف معجل للراتب',\n  leave: 'طلب إجازة',",
          "  salary_advance: 'صرف معجل للراتب',\n  exceptional_financial_payment: 'طلب صرف مالي استثنائي',\n  leave: 'طلب إجازة',")

          financial_validation = r'''    case 'exceptional_financial_payment': {
              const requestedDays = numberInRange(payload.requestedDays, 'requested_days', 0.5, 60);
              if (Math.round(requestedDays * 2) !== requestedDays * 2) {
                throw new AppError(400, 'core_employee_request:invalid_requested_days');
              }
              if (payload.acknowledgement !== true) {
                throw new AppError(400, 'core_employee_request:financial_payment_acknowledgement_required');
              }
              const signature = cleanText(payload.employeeSignatureDataUrl);
              if (!signature.startsWith('data:image/') || !signature.includes(';base64,') || signature.length < 200) {
                throw new AppError(400, 'core_employee_request:financial_payment_signature_required');
              }
              return {
                ...payload,
                requestedDays,
                reason: requiredReason(payload.reason),
                notes: cleanText(payload.notes),
                acknowledgement: true,
                employeeSignatureDataUrl: signature,
                balanceType: 'none',
                deductAnnualLeave: false,
              };
            }
'''
          replace_once(worker, "    case 'leave': {", financial_validation + "    case 'leave': {")

          replace_once(worker,
          "  const payload = validatePayload(type, data.payload || data.payload_json || data);\n  const idempotencyKey = cleanText(data.idempotencyKey || data.idempotency_key);",
          "  let payload = validatePayload(type, data.payload || data.payload_json || data);\n"
          "  if (type === 'exceptional_financial_payment') {\n"
          "    const employment = await dbFirst(\n"
          "      db,\n"
          "      `SELECT base_salary_halalas, leave_balance, employment_status FROM employee_employment\n"
          "        WHERE salon_id = ? AND employee_id = ? LIMIT 1`,\n"
          "      [salonId, identity.employeeId]\n"
          "    );\n"
          "    const baseSalaryHalalas = Math.max(0, Math.round(Number(employment?.base_salary_halalas || 0)));\n"
          "    if (!employment || baseSalaryHalalas <= 0) {\n"
          "      throw new AppError(409, 'core_employee_request:employee_salary_required');\n"
          "    }\n"
          "    const dayRateHalalas = Math.max(1, Math.round(baseSalaryHalalas / 30));\n"
          "    const calculatedAmountHalalas = Math.max(1, Math.round((baseSalaryHalalas * Number(payload.requestedDays)) / 30));\n"
          "    const annualLeaveBalanceSnapshot = Math.max(0, Number(employment.leave_balance || 0));\n"
          "    payload = {\n"
          "      ...payload,\n"
          "      baseSalaryHalalas,\n"
          "      dayRateHalalas,\n"
          "      calculatedAmountHalalas,\n"
          "      annualLeaveBalanceSnapshot,\n"
          "      balanceDeductionDays: 0,\n"
          "      calculationBasis: 'base_salary_divided_by_30',\n"
          "      payrollTreatment: 'manual_addition',\n"
          "      leaveBalanceTreatment: 'not_deducted',\n"
          "      legalTreatment: 'exceptional_payment_no_annual_leave_deduction',\n"
          "    };\n"
          "  }\n"
          "  const idempotencyKey = cleanText(data.idempotencyKey || data.idempotency_key);")

          exceptional_execute = r'''
          async function executeExceptionalFinancialPayment(db, salonId, row, payload, actor, input) {
            const payrollMonth = cleanText(input.payrollMonth) || riyadhDateKey().slice(0, 7);
            addMonths(payrollMonth, 0);
            const existing = await dbFirst(
              db,
              `SELECT * FROM employee_financial_payments WHERE salon_id = ? AND request_id = ? LIMIT 1`,
              [salonId, row.id]
            );
            if (existing) {
              await refreshPayrollFinancials(db, salonId, row.employee_id, existing.payroll_month);
              return { sourceType: 'employee_financial_payment', sourceId: existing.id, before: null, after: existing };
            }

            const payrollEntry = await dbFirst(
              db,
              `SELECT * FROM payroll_entries
                WHERE salon_id = ? AND employee_id = ? AND payroll_month = ?
                  AND COALESCE(status, 'draft') NOT IN ('approved', 'paid')
                LIMIT 1`,
              [salonId, row.employee_id, payrollMonth]
            );
            if (!payrollEntry) throw new AppError(409, 'core_employee_request:payroll_entry_required');

            const requestedDays = numberInRange(payload.requestedDays, 'requested_days', 0.5, 60);
            const baseSalaryHalalas = positiveInteger(payload.baseSalaryHalalas, 'base_salary', 100_000_000);
            const dayRateHalalas = positiveInteger(payload.dayRateHalalas, 'day_rate', 10_000_000);
            const amountHalalas = positiveInteger(payload.calculatedAmountHalalas, 'calculated_amount', 100_000_000);
            const financialReference = cleanText(input.financialReference) || `EFP-${row.request_number}`;
            const now = nowIso();
            const paymentId = generatedId('financial_payment');

            const parsedAdditions = parseJson(payrollEntry.additions_json, []);
            const additions = Array.isArray(parsedAdditions) ? parsedAdditions : [];
            const alreadyIncluded = additions.some((item) =>
              cleanText(item?.requestId || item?.request_id) === cleanText(row.id)
            );
            const nextAdditions = alreadyIncluded ? additions : [
              ...additions,
              {
                id: `employee_financial_payment:${row.id}`,
                type: 'exceptional_financial_payment',
                label: 'صرف مالي استثنائي',
                requestId: row.id,
                requestNumber: row.request_number,
                amountHalalas,
                requestedDays,
                financialReference,
              },
            ];
            const nextManualAdditions = Number(payrollEntry.manual_additions_halalas || 0) + (alreadyIncluded ? 0 : amountHalalas);

            await dbBatch(db, [
              {
                sql: `INSERT OR IGNORE INTO employee_financial_payments
                  (id, salon_id, request_id, request_number, employee_id, employee_uid,
                   requested_days, base_salary_halalas, day_rate_halalas, amount_halalas,
                   payroll_month, payroll_entry_id, financial_reference, payment_status,
                   leave_balance_deducted, approved_by_uid, approved_at, executed_by_uid,
                   executed_at, created_at, updated_at)
                 VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, 'included', 0, ?, ?, ?, ?, ?, ?)`,
                params: [
                  paymentId, salonId, row.id, row.request_number, row.employee_id, row.employee_uid,
                  requestedDays, baseSalaryHalalas, dayRateHalalas, amountHalalas,
                  payrollMonth, payrollEntry.id, financialReference, cleanText(row.decided_by_uid) || null,
                  row.approved_at || now, cleanText(actor.uid) || null, now, now, now,
                ],
              },
              {
                sql: `UPDATE payroll_entries
                        SET manual_additions_halalas = ?, additions_json = ?, updated_at = ?
                      WHERE salon_id = ? AND id = ?
                        AND COALESCE(status, 'draft') NOT IN ('approved', 'paid')`,
                params: [nextManualAdditions, json(nextAdditions), now, salonId, payrollEntry.id],
              },
            ]);

            const payrollEntryId = await refreshPayrollFinancials(db, salonId, row.employee_id, payrollMonth);
            if (!payrollEntryId) throw new AppError(409, 'core_employee_request:payroll_entry_required');
            const stored = await dbFirst(
              db,
              `SELECT * FROM employee_financial_payments WHERE salon_id = ? AND request_id = ? LIMIT 1`,
              [salonId, row.id]
            );
            return {
              sourceType: 'employee_financial_payment',
              sourceId: stored?.id || paymentId,
              before: null,
              after: {
                ...(stored || {}),
                payrollEntryId,
                leaveBalanceDeducted: false,
              },
            };
          }

'''
          replace_once(worker, "async function executeSalaryAdvance(db, salonId, row, payload, actor, input) {", exceptional_execute + "async function executeSalaryAdvance(db, salonId, row, payload, actor, input) {")
          replace_once(worker,
          "    case 'salary_advance': return executeSalaryAdvance(db, salonId, row, payload, actor, input);",
          "    case 'salary_advance': return executeSalaryAdvance(db, salonId, row, payload, actor, input);\n    case 'exceptional_financial_payment': return executeExceptionalFinancialPayment(db, salonId, row, payload, actor, input);")
          replace_once(worker,
          "  const [overtime, advances, installments] = await Promise.all([",
          "  const [overtime, advances, installments, financialPayments] = await Promise.all([")
          replace_once(worker,
          "    dbAll(\n      db,\n      `SELECT sai.* FROM salary_advance_installments sai\n        JOIN salary_advances sa ON sa.salon_id = sai.salon_id AND sa.id = sai.advance_id\n       WHERE sai.salon_id = ? AND sa.employee_id = ?\n       ORDER BY sai.payroll_month, sai.installment_number`,\n      [salonId, employeeId]\n    ),\n  ]);\n  return { overtime, advances, installments };",
          "    dbAll(\n      db,\n      `SELECT sai.* FROM salary_advance_installments sai\n        JOIN salary_advances sa ON sa.salon_id = sai.salon_id AND sa.id = sai.advance_id\n       WHERE sai.salon_id = ? AND sa.employee_id = ?\n       ORDER BY sai.payroll_month, sai.installment_number`,\n      [salonId, employeeId]\n    ),\n    dbAll(\n      db,\n      `SELECT * FROM employee_financial_payments\n        WHERE salon_id = ? AND employee_id = ?\n        ORDER BY executed_at DESC, created_at DESC LIMIT 100`,\n      [salonId, employeeId]\n    ),\n  ]);\n  return { overtime, advances, installments, financialPayments };")

          # ------------------------------------------------------------------
          # Frontend service contract
          # ------------------------------------------------------------------
          service = 'src/services/employeeRequests.ts'
          replace_once(service,
          '  | "salary_advance"\n  | "leave"',
          '  | "salary_advance"\n  | "exceptional_financial_payment"\n  | "leave"')
          replace_once(service,
          '  "core_employee_request:attendance_target_required":\n    "حدد البصمة المطلوب تعديلها بإدخال الوقت الحالي الصحيح أو استخدم نوع إضافة بصمة.",',
          '  "core_employee_request:attendance_target_required":\n    "حدد البصمة المطلوب تعديلها بإدخال الوقت الحالي الصحيح أو استخدم نوع إضافة بصمة.",\n  "core_employee_request:invalid_requested_days": "عدد الأيام المرجعية يجب أن يكون بين نصف يوم و60 يومًا وبزيادات نصف يوم.",\n  "core_employee_request:employee_salary_required": "لا يمكن حساب الصرف لأن الراتب الأساسي غير مسجل في ملف الموظفة داخل Core.",\n  "core_employee_request:payroll_entry_required": "لا يوجد مسير راتب مفتوح وقابل للتعديل للشهر المحدد. أنشئ أو افتح المسير أولًا ثم أعد التنفيذ.",\n  "core_employee_request:financial_payment_acknowledgement_required": "يجب الموافقة على الإقرار قبل إرسال طلب الصرف المالي.",\n  "core_employee_request:financial_payment_signature_required": "يجب توقيع طلب الصرف المالي بخط اليد قبل الإرسال.",')
          replace_once(service,
          '  salary_advance: "صرف معجل للراتب",\n  leave: "طلب إجازة",',
          '  salary_advance: "صرف معجل للراتب",\n  exceptional_financial_payment: "طلب صرف مالي استثنائي",\n  leave: "طلب إجازة",')
          replace_once(service,
          '  if (input.requestType === "leave" && !isSignatureDataUrl(input.payload.employeeSignatureDataUrl)) {\n    throw new Error("يجب توقيع طلب الإجازة بخط اليد قبل الإرسال.");\n  }',
          '  if (input.requestType === "leave" && !isSignatureDataUrl(input.payload.employeeSignatureDataUrl)) {\n    throw new Error("يجب توقيع طلب الإجازة بخط اليد قبل الإرسال.");\n  }\n  if (input.requestType === "exceptional_financial_payment" && !isSignatureDataUrl(input.payload.employeeSignatureDataUrl)) {\n    throw new Error("يجب توقيع طلب الصرف المالي بخط اليد قبل الإرسال.");\n  }')
          replace_once(service,
          'export type EmployeeRequestEvent = {\n  id: string;\n  event_type: string;',
          'export type EmployeeRequestEvent = {\n  id: string;\n  event_type: string;\n  before_json?: string | null;\n  after_json?: string | null;')
          replace_once(service,
          '  installments: Array<{\n    id: string;\n    advance_id: string;\n    installment_number: number;\n    payroll_month: string;\n    amount_halalas: number;\n    status: string;\n  }>;\n};',
          '  installments: Array<{\n    id: string;\n    advance_id: string;\n    installment_number: number;\n    payroll_month: string;\n    amount_halalas: number;\n    status: string;\n  }>;\n  financialPayments: Array<{\n    id: string;\n    request_id: string;\n    request_number: string;\n    requested_days: number;\n    amount_halalas: number;\n    payroll_month: string;\n    payroll_entry_id: string;\n    financial_reference: string;\n    payment_status: string;\n    leave_balance_deducted: number;\n    executed_at: string;\n  }>;\n};')

          # ------------------------------------------------------------------
          # Formal request document + form
          # ------------------------------------------------------------------
          Path('src/components/hr/ExceptionalFinancialPaymentRequestDocument.tsx').write_text(r'''import malikatLogo from "../../assets/images/ssunnamed.png";
          import type { EmployeeRequest, EmployeeRequestEvent } from "../../services/employeeRequests";
          import { EMPLOYEE_REQUEST_STATUS_LABELS } from "../../services/employeeRequests";
          import { DocumentField, DocumentFieldGrid, DocumentLongText, DocumentPage, DocumentSection } from "../../documents/core/DocumentPage";
          import SignatureCaptureField from "./SignatureCaptureField";
          import "../../styles/LeaveRequestDocument.css";

          export type ExceptionalFinancialPaymentFormState = Record<string, string | boolean>;

          type FormProps = {
            employeeName: string;
            form: ExceptionalFinancialPaymentFormState;
            update: (name: string, value: string | boolean) => void;
          };

          function formatMoneyHalalas(value: unknown) {
            const amount = Number(value || 0) / 100;
            return `${amount.toLocaleString("ar-SA", { minimumFractionDigits: 2, maximumFractionDigits: 2 })} ريال`;
          }

          function formatDateTime(value: unknown) {
            const parsed = Date.parse(String(value || ""));
            if (!Number.isFinite(parsed)) return "—";
            return new Intl.DateTimeFormat("ar-SA-u-ca-gregory", {
              timeZone: "Asia/Riyadh",
              dateStyle: "medium",
              timeStyle: "short",
            }).format(new Date(parsed));
          }

          function parseEventPayload(event?: EmployeeRequestEvent | null) {
            if (!event?.payload_json) return {} as Record<string, unknown>;
            try {
              const parsed = JSON.parse(event.payload_json);
              return parsed && typeof parsed === "object" ? parsed as Record<string, unknown> : {};
            } catch {
              return {} as Record<string, unknown>;
            }
          }

          function parseAfter(event?: EmployeeRequestEvent | null) {
            if (!event?.after_json) return {} as Record<string, unknown>;
            try {
              const parsed = JSON.parse(event.after_json);
              const after = parsed && typeof parsed === "object" ? (parsed as Record<string, unknown>).after : null;
              return after && typeof after === "object" ? after as Record<string, unknown> : {};
            } catch {
              return {} as Record<string, unknown>;
            }
          }

          function decisionEvent(request: EmployeeRequest) {
            return [...(request.events || [])].reverse().find((event) =>
              ["approve", "approved", "reject", "rejected"].includes(String(event.event_type || "").toLowerCase())
            );
          }

          function executionEvent(request: EmployeeRequest) {
            return [...(request.events || [])].reverse().find((event) => event.event_type === "execution_completed");
          }

          export function ExceptionalFinancialPaymentRequestFormFields({ employeeName, form, update }: FormProps) {
            return (
              <DocumentPage className="leave-doc leave-doc--editable" labelledBy="financial-payment-request-draft-title">
                <img className="leave-doc-watermark" src={malikatLogo} alt="" aria-hidden="true" />
                <header className="leave-doc-header">
                  <div className="leave-doc-brand" aria-label="شعار ملكات"><img src={malikatLogo} alt="شعار ملكات" /></div>
                  <h2 id="financial-payment-request-draft-title">طلب صرف مالي استثنائي</h2>
                </header>

                <div className="employee-request-decision">
                  <strong>تنبيه مهم</strong>
                  <p>هذا الطلب مالي مستقل. عدد الأيام هنا مرجع للحساب فقط، ولا يخصم النظام أي يوم من رصيد الإجازة السنوية.</p>
                </div>

                <DocumentFieldGrid>
                  <label className="employee-request-field">
                    <span>عدد الأيام المرجعية *</span>
                    <input type="number" min="0.5" max="60" step="0.5" required value={String(form.requestedDays || "")} onChange={(event) => update("requestedDays", event.target.value)} />
                  </label>
                  <DocumentField label="أساس الحساب" value="الراتب الأساسي ÷ 30 × عدد الأيام" />
                </DocumentFieldGrid>

                <label className="leave-doc-wide-field">
                  <span>سبب الطلب</span>
                  <textarea required value={String(form.reason || "")} onChange={(event) => update("reason", event.target.value)} />
                </label>
                <label className="leave-doc-wide-field">
                  <span>ملاحظات إضافية</span>
                  <textarea value={String(form.notes || "")} onChange={(event) => update("notes", event.target.value)} />
                </label>

                <label className="employee-request-check employee-request-check--ack">
                  <input type="checkbox" required checked={Boolean(form.acknowledgement)} onChange={(event) => update("acknowledgement", event.target.checked)} />
                  <span>أقر بصحة البيانات وأفهم أن هذا الطلب صرف مالي مستقل ولا يخصم رصيدي السنوي.</span>
                </label>

                <div className="leave-doc-signature-row">
                  <div className="leave-doc-signature-cell"><span>الاسم</span><strong>{employeeName || "الموظفة"}</strong></div>
                  <SignatureCaptureField
                    compact
                    required
                    label="توقيع الموظفة"
                    signerName={employeeName || "الموظفة"}
                    value={String(form.employeeSignatureDataUrl || "")}
                    onChange={(signature) => update("employeeSignatureDataUrl", signature)}
                  />
                </div>
                <small>تُحسب القيمة النهائية من الراتب الأساسي المسجل في Core عند إرسال الطلب، وتُحفظ كـSnapshot داخل الطلب.</small>
              </DocumentPage>
            );
          }

          export default function ExceptionalFinancialPaymentRequestDocument({ request }: { request: EmployeeRequest }) {
            const payload = request.payload || {};
            const decision = decisionEvent(request);
            const decisionPayload = parseEventPayload(decision);
            const execution = executionEvent(request);
            const effect = parseAfter(execution);
            const approved = ["approved", "executing", "completed"].includes(request.status) || ["approve", "approved"].includes(String(decision?.event_type || ""));
            const rejected = request.status === "rejected" || ["reject", "rejected"].includes(String(decision?.event_type || ""));
            const employeeName = request.employee_name_snapshot || request.employee_id || "الموظفة";
            const beforeBalance = Number(payload.annualLeaveBalanceSnapshot || 0);
            const afterBalance = beforeBalance;
            const managerSignature = String(decisionPayload.reviewerSignatureDataUrl || "");
            const employeeSignature = String(payload.employeeSignatureDataUrl || "");
            const amount = formatMoneyHalalas(payload.calculatedAmountHalalas);

            return (
              <DocumentPage className="leave-doc financial-payment-request-print-root" labelledBy="financial-payment-request-document-title">
                <img className="leave-doc-watermark" src={malikatLogo} alt="" aria-hidden="true" />
                <header className="leave-doc-header">
                  <div className="leave-doc-brand" aria-label="شعار ملكات"><img src={malikatLogo} alt="شعار ملكات" /></div>
                  <h2 id="financial-payment-request-document-title">طلب صرف مالي استثنائي</h2>
                </header>
                <div className="leave-doc-number">رقم الطلب: <strong>{request.request_number}</strong></div>

                <DocumentFieldGrid>
                  <DocumentField label="الموظفة" value={employeeName} />
                  <DocumentField label="رقم الموظفة" value={request.employee_id} />
                  <DocumentField label="عدد الأيام المرجعية" value={String(payload.requestedDays || "—")} />
                  <DocumentField label="تاريخ الطلب" value={formatDateTime(request.submitted_at)} />
                  <DocumentField label="الراتب الأساسي وقت الطلب" value={formatMoneyHalalas(payload.baseSalaryHalalas)} />
                  <DocumentField label="قيمة اليوم" value={formatMoneyHalalas(payload.dayRateHalalas)} />
                  <DocumentField label="إجمالي الصرف" value={amount} />
                  <DocumentField label="حالة الطلب" value={EMPLOYEE_REQUEST_STATUS_LABELS[request.status] || request.status} />
                </DocumentFieldGrid>

                <DocumentLongText label="سبب الطلب" value={String(payload.reason || "—")} />
                {payload.notes ? <DocumentLongText label="ملاحظات" value={String(payload.notes)} /> : null}

                <DocumentSection title="أثر الرصيد">
                  <DocumentFieldGrid>
                    <DocumentField label="الرصيد السنوي قبل العملية" value={`${beforeBalance} يوم`} />
                    <DocumentField label="الأيام المخصومة" value="0 يوم" />
                    <DocumentField label="الرصيد السنوي بعد العملية" value={`${afterBalance} يوم`} />
                    <DocumentField label="المعالجة" value="صرف مالي مستقل — لا خصم من الإجازة السنوية" />
                  </DocumentFieldGrid>
                </DocumentSection>

                <div className="leave-doc-signature-row">
                  <div className="leave-doc-signature-cell"><span>اسم الموظفة</span><strong>{employeeName}</strong></div>
                  <div className="leave-doc-signature-cell">
                    <span>توقيع الموظفة</span>
                    {employeeSignature ? <img className="leave-doc-signature-image" src={employeeSignature} alt={`توقيع ${employeeName}`} /> : <strong>غير موقع</strong>}
                    <small>{formatDateTime(request.submitted_at)}</small>
                  </div>
                </div>

                <DocumentSection title="اعتماد الإدارة" className="leave-doc-manager-opinion">
                  <DocumentFieldGrid>
                    <DocumentField label="القرار" value={approved ? "مع الموافقة" : rejected ? "مرفوض" : "قيد المراجعة"} />
                    <DocumentField label="المسؤول" value={decision?.actor_name || request.assigned_to_name || "—"} />
                    <DocumentField label="تاريخ القرار" value={decision ? formatDateTime(decision.created_at) : "—"} />
                    <DocumentField label="حالة الصرف" value={request.status === "completed" ? "تم إدراجه في المسير" : "لم يكتمل"} />
                  </DocumentFieldGrid>
                  <DocumentLongText label="ملاحظات / القرار" value={request.rejection_reason || request.decision_note || decision?.note || "—"} />
                  <div className="leave-doc-signature-row">
