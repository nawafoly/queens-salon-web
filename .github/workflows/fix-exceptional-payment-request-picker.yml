name: Fix exceptional payment request picker

on:
  push:
    branches:
      - fix/exceptional-payment-request-picker

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Add exceptional payment card to employee request picker
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/pages/EmployeePortal.tsx')
          text = path.read_text(encoding='utf-8')
          new_line = '    { label: "طلب صرف مالي استثنائي", description: "صرف مالي حسب عدد الأيام المرجعية", icon: faWallet, to: "/employee/requests?new=exceptional_financial_payment", permission: "employee_requests.own.create" as AppPermission },\n'
          if new_line in text:
              raise SystemExit('Exceptional payment picker card already exists')
          needle = '    { label: "صرف معجل للراتب", description: "طلب مالي يراجع من HR", icon: faWallet, to: "/employee/requests?new=salary_advance", permission: "employee_requests.own.create" as AppPermission },\n'
          if needle not in text:
              raise SystemExit('Expected salary advance picker item was not found')
          text = text.replace(needle, needle + new_line, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - run: npm ci
      - run: npm run build
      - name: Commit source fix and remove temporary workflow
        shell: bash
        run: |
          git config user.name "nawafoly"
          git config user.email "114729674+nawafoly@users.noreply.github.com"
          git rm .github/workflows/fix-exceptional-payment-request-picker.yml
          git add src/pages/EmployeePortal.tsx
          git commit -m "Show exceptional financial payment in request picker"
          git push origin HEAD:fix/exceptional-payment-request-picker
