name: Dev Dependency Security Audit Temp

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/dependency-dev-security-audit-temp.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove-miniflare-v5-compat:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact baseline
        run: npm ci

      - name: Convert Account test constructor to Miniflare v5 shape
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const p = 'workers/account-permissions-worker.test.mjs';
          let s = fs.readFileSync(p, 'utf8');
          const old = `  const mf = new Miniflare({\n    modules: true,\n    script: 'export default { fetch(){ return new Response("ok") } }',\n    compatibilityDate: "2026-06-24",\n    d1Databases: { CORE_DB: "core-test" },\n  });`;
          const next = `  const script = 'export default { fetch(){ return new Response("ok") } }';\n  const mf = new Miniflare({\n    workers: [\n      {\n        config: {\n          type: "worker",\n          name: "core-test-worker",\n          compatibilityDate: "2026-06-24",\n          manifest: {\n            mainModule: "script-0.mjs",\n            modulesRoot: process.cwd(),\n            modules: {\n              "script-0.mjs": { type: "esm", contents: script },\n            },\n          },\n          env: {\n            CORE_DB: { type: "d1", id: "core-test" },\n          },\n          exports: {},\n        },\n        dev: { rootPath: process.cwd() },\n      },\n    ],\n  });`;
          if (!s.includes(old)) throw new Error('expected account Miniflare v4 block missing');
          fs.writeFileSync(p, s.replace(old, next));
          NODE

      - name: Convert HR test constructor to Miniflare v5 shape
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const p = 'workers/hr-core-worker.test.mjs';
          let s = fs.readFileSync(p, 'utf8');
          const old = `  const mf = new Miniflare({\n    modules: true,\n    script: 'export default { fetch(){ return new Response("ok") } }',\n    compatibilityDate: '2026-06-24',\n    d1Databases: { CORE_DB: 'core-test' },\n    r2Buckets: ['FILES_BUCKET'],\n  });`;
          const next = `  const script = 'export default { fetch(){ return new Response("ok") } }';\n  const mf = new Miniflare({\n    workers: [\n      {\n        config: {\n          type: "worker",\n          name: "core-test-worker",\n          compatibilityDate: "2026-06-24",\n          manifest: {\n            mainModule: "script-0.mjs",\n            modulesRoot: process.cwd(),\n            modules: {\n              "script-0.mjs": { type: "esm", contents: script },\n            },\n          },\n          env: {\n            CORE_DB: { type: "d1", id: "core-test" },\n            FILES_BUCKET: { type: "r2", name: "FILES_BUCKET" },\n          },\n          exports: {},\n        },\n        dev: { rootPath: process.cwd() },\n      },\n    ],\n  });`;
          if (!s.includes(old)) throw new Error('expected HR Miniflare v4 block missing');
          fs.writeFileSync(p, s.replace(old, next));
          NODE

      - name: Install Miniflare v5 candidate directly
        shell: bash
        run: |
          npm install --save-dev --package-lock-only miniflare@5.20260811.0-alpha
          rm -rf node_modules
          npm ci
          npm ls miniflare --depth=3 || true

      - name: Account permission tests on Miniflare v5
        run: node --test workers/account-permissions-worker.test.mjs

      - name: HR Core D1 and R2 tests on Miniflare v5
        run: node --test workers/hr-core-worker.test.mjs

      - name: Diff check
        run: git diff --check
