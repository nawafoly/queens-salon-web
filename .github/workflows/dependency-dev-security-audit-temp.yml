name: Dev Dependency Security Audit Temp

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/dependency-dev-security-audit-temp.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-patched-wrangler-line:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Inspect patched Wrangler releases and Miniflare dependencies
        shell: bash
        run: |
          for v in 4.120.0 4.120.1 4.121.0 4.121.1 4.122.0; do
            echo "=== wrangler@$v ==="
            npm view "wrangler@$v" version dependencies.miniflare 2>&1 || true
          done
          echo "=== miniflare dist-tags ==="
          npm view miniflare dist-tags --json
          echo "=== wrangler dist-tags ==="
          npm view wrangler dist-tags --json
