name: Repository Hygiene Wave 3A Retry

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/repository-hygiene-wave3a-retry.yml"

permissions:
  contents: write

jobs:
  retire-one-time-mutations:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Align stale frontend migration contracts
        run: node scripts/align-frontend-migration-v2-only.mjs

      - name: Retire inspected mutation workflows and unreferenced scripts
        run: node scripts/repository-hygiene-wave3a.mjs

      - name: Repository hygiene guard
        run: npm run check:repo-hygiene

      - name: Booking runtime audit
        run: node scripts/audit-legacy-booking-runtime.mjs --fail-on-high-risk

      - name: No-legacy booking runtime guard
        run: node scripts/check-no-legacy-booking-runtime.mjs

      - name: Internal booking contract
        run: npm run check:booking-internal-contract

      - name: Dashboard V2 gate
        run: npm run check:dashboard-v2

      - name: Build
        run: npm run build

      - name: Core worker tests
        run: npm run test:core:worker

      - name: HR worker tests
        run: npm run test:hr:worker

      - name: Frontend Core migration tests
        run: npm run test:frontend:core

      - name: Diff check
        run: git diff --check

      - name: Commit wave 3A cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No wave 3A cleanup changes to commit."
            exit 0
          fi
          git commit -m "Retire obsolete repository mutation workflows"
          git push origin HEAD:main
