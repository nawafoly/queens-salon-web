name: Temporary Employee Request Hardening 2
on:
  push:
    branches:
      - fix/employee-request-workflow-hardening
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/employee-request-workflow-hardening
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply permission hardening
        run: python scripts/tmp-permission-hardening.py
      - name: Verify permission scope and build
        run: |
          npm ci
          node --test workers/permission-lifecycle-hardening.test.mjs
          node scripts/check-employee-leave-core-cutover.mjs
          npm run build
          git diff --check
      - name: Commit patch
        run: |
          git config user.name "nawafoly"
          git config user.email "114729674+nawafoly@users.noreply.github.com"
          git add workers/core/repositories/permissions.js workers/core/repositories/employee-requests-legacy.js workers/permission-lifecycle-hardening.test.mjs
          git commit -m "fix(hr): preserve actual permission lifecycle"
          git push
