name: Temporary Weekly Off Final Acceptance

on:
  push:
    branches: [main]
    paths:
      - "workers/temporary-weekly-off-suspension.test.mjs"
      - ".github/workflows/temporary-weekly-off-final-acceptance.yml"
      - "src/pages/dashboardEmployees/TemporaryWeeklyOffPeriodCard.tsx"
      - "src/services/temporaryWeeklyOffService.ts"
      - "workers/core/repositories/shift-control.js"
      - "src/helpers/hr/attendanceCalendarData.ts"
      - "src/helpers/hr/**payroll**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Temporary weekly-off suspension acceptance
        run: node --test workers/temporary-weekly-off-suspension.test.mjs

      - name: HR schedule date policy
        run: node --test workers/hr-schedule-date-policy.test.mjs

      - name: Attendance calendar policy
        run: node --test workers/attendance-calendar-data.test.mjs

      - name: Attendance shift policy
        run: node --test workers/shift-attendance-policy.test.mjs

      - name: Payroll policies
        run: node --test workers/payroll-deduction-policy.test.mjs workers/payroll-leave-absence-policy.test.mjs

      - name: Core worker tests
        run: node --test workers/core-worker.test.mjs

      - name: HR worker tests
        run: node --test workers/hr-core-worker.test.mjs

      - name: Build
        run: npm run build

      - name: Diff check
        run: git diff --check HEAD^ HEAD
