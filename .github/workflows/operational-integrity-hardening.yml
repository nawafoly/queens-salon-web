name: Operational Integrity Hardening

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: operational-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Firebase Functions dependencies
        run: npm --prefix functions ci

      - name: Verify Firebase Functions TypeScript
        run: npm --prefix functions run build

      - name: iPhone Dynamic Island safe area and embedded HR scroll regression
        run: node --test workers/ios-dashboard-safe-area-shell.test.mjs

      - name: Employee mobile profile icons and calendar readability regression
        run: node --test workers/employee-mobile-profile-calendar-ui.test.mjs

      - name: Read-only D1 Insights profiling regression
        run: node --test workers/d1-insights-read-cost.test.mjs

      - name: Read-only D1 Insights pre-post comparison regression
        run: node --test workers/d1-insights-comparison.test.mjs

      - name: Owner permission index and revocation regression
        run: node --test workers/owner-permission-d1-covering-index.test.mjs

      - name: Client directory summary request coalescing regression
        run: node --test workers/short-lived-request-cache.test.mjs

      - name: Attendance Worker syntax guard
        run: node --check workers/attendance-worker.js

      - name: Attendance device summary read-cost regression
        run: node --test workers/attendance-device-summary-readcost.test.mjs

      - name: Attendance per-device registry read-cost regression
        run: node --test workers/attendance-device-usage-readcost.test.mjs

      - name: Attendance admin device registry consistency regression
        run: node --test workers/attendance-device-admin-reconcile.test.mjs

      - name: Fixed interval polling guard
        run: node scripts/check-fixed-interval-polling.mjs

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Internal auth identity reconciliation
        run: node --test workers/internal-auth-identity-reconciliation.test.mjs

      - name: Core route id normalization
        run: node --test workers/core-id-normalization.test.mjs

      - name: Employee lifecycle payroll integrity guard
        run: node scripts/check-employee-lifecycle-payroll-integrity.mjs

      - name: Payroll deduction compliance
        run: node --test workers/payroll-deduction-compliance.test.mjs

      - name: Locked payroll attendance correction dispatch regression
        run: node --test workers/attendance-locked-payroll-dispatch.test.mjs

      - name: Salary advance contracts
        run: node --test workers/salary-advance-core-only.test.mjs

      - name: Partial deduction deferral contract
        run: node --test workers/payroll-partial-deduction-deferral-contract.test.mjs

      - name: HR Core runtime
        run: node --test workers/hr-core-worker.test.mjs

      - name: Operational integrity final gate
        run: npm run verify:operational-integrity

      - name: Diff check
        run: git diff --check
