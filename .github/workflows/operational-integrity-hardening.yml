name: Operational Integrity Hardening

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: operational-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install
        run: npm ci

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Operational integrity final gate
        run: npm run verify:operational-integrity

      - name: Diff check
        run: git diff --check
