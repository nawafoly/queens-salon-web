name: Exceptional payment merge check

on:
  push:
    branches:
      - agent/exceptional-financial-payment

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/exceptional-financial-payment
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Merge current main in working tree
        shell: bash
        run: |
          git config user.name "merge-check"
          git config user.email "merge-check@example.invalid"
          git fetch origin main
          git merge --no-commit --no-ff origin/main

      - name: Install
        run: npm ci

      - name: Core tests
        run: node --test workers/hr-core-worker.test.mjs

      - name: Dashboard requests acceptance
        run: npm run check:dashboard-requests-v2

      - name: Build merged working tree
        run: npm run build

      - name: Diff check
        run: git diff --check
