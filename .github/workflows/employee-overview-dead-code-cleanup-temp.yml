name: Employee Overview Dead Code Cleanup Temp

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/employee-overview-dead-code-cleanup-temp.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Remove dead overview helper and strengthen contract
        run: |
          python - <<'PY'
          from pathlib import Path

          page_path = Path("src/pages/hr/EmployeeOverview.tsx")
          contract_path = Path("scripts/check-employee-portal-overview-v2.mjs")
          page = page_path.read_text(encoding="utf-8")
          contract = contract_path.read_text(encoding="utf-8")

          type_line = '  type AttendanceStatus,\n'
          if page.count(type_line) != 1:
              raise SystemExit("AttendanceStatus import anchor missing")
          page = page.replace(type_line, "", 1)

          helper = '''function getAttendanceDayStatusLabel(status: AttendanceStatus) {\n  if (status === "present") return "حضور مكتمل";\n  if (status === "late") return "متأخر";\n  if (status === "missing_hours") return "ناقص ساعات";\n  if (status === "in_progress") return "بانتظار تسجيل الانصراف";\n  if (status === "partial") return "حضور يحتاج مراجعة";\n  if (status === "absent") return "غياب";\n  if (status === "leave") return "إجازة";\n  if (status === "off_day") return "يوم راحة";\n  if (status === "future") return "يوم قادم";\n  if (status === "today_pending") return "بانتظار تسجيل الحضور اليوم";\n  return "بانتظار تسجيل الحضور اليوم";\n}\n\n'''
          if page.count(helper) != 1:
              raise SystemExit("dead attendance status helper anchor missing")
          page = page.replace(helper, "", 1)

          forbidden_anchor = '''    "scheduleForEmployeeDate",\n  ];'''
          forbidden_replacement = '''    "scheduleForEmployeeDate",\n    "getAttendanceDayStatusLabel",\n  ];'''
          if contract.count(forbidden_anchor) != 1:
              raise SystemExit("contract forbidden marker anchor missing")
          contract = contract.replace(forbidden_anchor, forbidden_replacement, 1)

          if "getAttendanceDayStatusLabel" in page or "AttendanceStatus" in page:
              raise SystemExit("dead overview attendance helper still present")

          page_path.write_text(page, encoding="utf-8")
          contract_path.write_text(contract, encoding="utf-8")
          PY

      - name: Remove temporary workflow before hygiene checks
        run: rm .github/workflows/employee-overview-dead-code-cleanup-temp.yml

      - name: Install exact lockfile
        run: npm ci

      - name: Employee overview V2 contract
        run: npm run check:employee-portal-overview-v2

      - name: Dashboard V2 contract
        run: npm run check:dashboard-v2

      - name: HR D1-only guard
        run: npm run check:hr:d1-only

      - name: HR worker tests
        run: npm run test:hr:worker

      - name: Repository hygiene guard
        run: npm run check:repo-hygiene

      - name: Build
        run: npm run build

      - name: Diff check
        run: git diff --check

      - name: Verify exact cleanup scope
        shell: bash
        run: |
          mapfile -t changed < <(git diff --name-only HEAD)
          printf '%s\n' "${changed[@]}"
          allowed='^(src/pages/hr/EmployeeOverview\.tsx|scripts/check-employee-portal-overview-v2\.mjs|\.github/workflows/employee-overview-dead-code-cleanup-temp\.yml)$'
          for file in "${changed[@]}"; do
            [[ "$file" =~ $allowed ]] || { echo "Unexpected changed file: $file"; exit 1; }
          done
          [[ ${#changed[@]} -eq 3 ]] || { echo "Expected exactly 3 scoped cleanup changes"; exit 1; }

      - name: Promote dead-code cleanup to main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- src/pages/hr/EmployeeOverview.tsx scripts/check-employee-portal-overview-v2.mjs .github/workflows/employee-overview-dead-code-cleanup-temp.yml
          git commit -m "Remove employee overview dead runtime helper"
          git push origin HEAD:main
