name: Apply Dashboard V2 Style Regression Fix

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-dashboard-v2-style-regression-fix.yml"
      - "scripts/fix-dashboard-v2-style-regressions.mjs"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Apply deterministic style cleanup
        run: node scripts/fix-dashboard-v2-style-regressions.mjs

      - name: Core Dashboard V2 contract
        run: npm run check:dashboard-v2

      - name: HR Dashboard contracts
        run: |
          npm run check:dashboard-hr-v2
          npm run check:dashboard-requests-v2
          npm run check:dashboard-permissions-v2
          npm run check:dashboard-recruitment-v2
          npm run check:dashboard-messages-v2
          node scripts/check-dashboard-files-v2.mjs
          node scripts/check-dashboard-create-staff-v2.mjs

      - name: Build
        run: npm run build

      - name: Diff check
        run: git diff --check

      - name: Commit cleanup
        run: |
          if git diff --quiet; then
            echo "No cleanup changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/DashboardBookings.tsx \
            src/components/EmployeeNotificationBellMenu.tsx \
            src/components/dashboard-v2/employee-workspace/live/EmployeeAttendanceCalendarAlignedLiveV2.tsx \
            src/styles/dashboard-v2/dashboard-v2.css \
            src/styles/dashboard-v2/pages/employees.css \
            src/styles/dashboard-v2/pages/expenses.css \
            src/styles/dashboard-v2/pages/bookings.css
          git commit -m "Restore Dashboard V2 style contract"
          git push origin HEAD:main
