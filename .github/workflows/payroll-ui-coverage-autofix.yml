name: Payroll UI coverage autofix

on:
  push:
    branches:
      - fix/payroll-ui-coverage-and-export

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Recover and validate patch script
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          import subprocess
          from pathlib import Path

          source_sha = "f75ac25d1529da8af65975573a11861252c3e736"
          workflow_path = ".github/workflows/payroll-ui-coverage-autofix.yml"
          source = subprocess.check_output(
              ["git", "show", f"{source_sha}:{workflow_path}"],
              text=True,
          )
          start_marker = "          node <<'NODE'\n"
          end_marker = "\n          NODE\n"
          if start_marker not in source or end_marker not in source:
              raise SystemExit("autofix script markers not found")
          body = source.split(start_marker, 1)[1].split(end_marker, 1)[0]

          normalized_lines = []
          in_template = False
          for line in body.splitlines():
              current = line if in_template else (line[10:] if line.startswith("          ") else line)
              normalized_lines.append(current)
              unescaped_ticks = len(re.findall(r"(?<!\\)`", current))
              if unescaped_ticks % 2 == 1:
                  in_template = not in_template

          normalized = "\n".join(normalized_lines) + "\n"
          Path("/tmp/payroll-ui-autofix.js").write_text(normalized, encoding="utf-8")
          PY
          node --check /tmp/payroll-ui-autofix.js

      - name: Apply focused payroll UI and export fixes
        run: node /tmp/payroll-ui-autofix.js

      - name: Install dependencies
        run: npm ci

      - name: Targeted payroll export contract
        run: node --test workers/payroll-executive-export-contract.test.mjs

      - name: Core worker regression suite
        run: npm run test:core:worker

      - name: Production build
        run: npm run build

      - name: Diff hygiene
        run: git diff --check

      - name: Commit validated source changes
        shell: bash
        run: |
          rm -f .github/workflows/payroll-ui-coverage-autofix.yml .github/.payroll-autofix-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(payroll): expose deferrals and complete export breakdown"
          git push origin HEAD:fix/payroll-ui-coverage-and-export
