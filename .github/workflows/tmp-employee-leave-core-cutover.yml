name: Temporary Employee Leave Core Cutover

on:
  push:
    branches:
      - audit/d1-request-amplification-hardening
    paths:
      - scripts/tmp-employee-leave-core-cutover.py
      - .github/workflows/tmp-employee-leave-core-cutover.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/d1-request-amplification-hardening
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply employee leave Core cutover
        run: python scripts/tmp-employee-leave-core-cutover.py
      - name: Verify focused scope and build
        run: |
          npm ci
          node --test workers/employee-leave-page-core-cutover.test.mjs
          node scripts/check-employee-leave-core-cutover.mjs
          npm run build
          git diff --check
      - name: Commit final patch and remove temporary runner
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/hr/EmployeeLeave.tsx scripts/check-employee-leave-core-cutover.mjs workers/employee-leave-page-core-cutover.test.mjs
          git rm scripts/tmp-employee-leave-core-cutover.py .github/workflows/tmp-employee-leave-core-cutover.yml
          git commit -m "fix(hr): route employee leave creation through Core"
          git push origin HEAD:audit/d1-request-amplification-hardening
