name: Finalize Booking Runtime Cutover

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/finalize-booking-cutover.yml"
      - "package.json"
      - "scripts/check-no-legacy-booking-runtime.mjs"
      - "scripts/audit-legacy-booking-runtime.mjs"
      - "scripts/finalize-booking-runtime-cutover.mjs"
      - "scripts/check-booking-shift-end-boundary.mjs"
      - "scripts/fix-hr-test-migration-runner.mjs"
      - "scripts/repair-frontend-core-migration-test.mjs"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Recover complete frontend migration test suite
        run: node scripts/repair-frontend-core-migration-test.mjs

      - name: Apply final cleanup
        run: node scripts/finalize-booking-runtime-cutover.mjs

      - name: Fix HR test migration runner
        run: node scripts/fix-hr-test-migration-runner.mjs

      - name: Audit after cleanup
        run: node scripts/audit-legacy-booking-runtime.mjs | tee legacy-booking-audit-final.txt

      - name: Architecture guard after cleanup
        run: node scripts/check-no-legacy-booking-runtime.mjs

      - name: Employee shift-end boundary behavior
        shell: bash
        run: |
          set +e
          node scripts/check-booking-shift-end-boundary.mjs 2>&1 | tee booking-shift-boundary.log
          code=${PIPESTATUS[0]}
          set -e
          exit "$code"

      - name: Build
        run: npm run build

      - name: Core worker tests
        shell: bash
        run: |
          set +e
          npm run test:core:worker 2>&1 | tee core-worker-final.log
          code=${PIPESTATUS[0]}
          set -e
          exit "$code"

      - name: HR worker tests
        shell: bash
        run: |
          set +e
          npm run test:hr:worker 2>&1 | tee hr-worker-final.log
          code=${PIPESTATUS[0]}
          set -e
          exit "$code"

      - name: Frontend Core migration tests
        run: npm run test:frontend:core

      - name: Diff check
        run: git diff --check

      - name: Promote cleanup only after every check is green
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/pages/DashboardBookings.tsx \
            src/services/firestoreBookings.ts \
            workers/core-worker.test.mjs \
            workers/hr-core-worker.test.mjs \
            scripts/check-frontend-core-migration.mjs \
            workers/frontend-core-migration.test.mjs
          if git diff --cached --quiet; then
            echo "Cleanup already present."
            exit 0
          fi
          git commit -m "Finalize Core HR booking runtime cutover"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Upload Core worker test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-worker-final-log
          path: core-worker-final.log
          if-no-files-found: ignore

      - name: Upload HR worker test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hr-worker-final-log
          path: hr-worker-final.log
          if-no-files-found: ignore

      - name: Upload shift boundary observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: booking-shift-boundary-results
          path: |
            booking-shift-boundary-results.json
            booking-shift-boundary.log
          if-no-files-found: ignore

      - name: Upload final audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legacy-booking-audit-final
          path: legacy-booking-audit-final.txt
          if-no-files-found: ignore
