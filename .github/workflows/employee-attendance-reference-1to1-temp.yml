name: Employee Attendance Reference 1to1 Temp

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/employee-attendance-reference-1to1-temp.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Remove legacy employee overview presentation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          mobile_path = Path("src/styles/EmployeePortalMobileNav.css")
          page_path = Path("src/pages/hr/EmployeeOverview.tsx")
          contract_path = Path("scripts/check-employee-portal-overview-v2.mjs")

          mobile = mobile_path.read_text(encoding="utf-8")
          page = page_path.read_text(encoding="utf-8")
          contract = contract_path.read_text(encoding="utf-8")

          def remove_marked_block(text, start_marker, end_marker):
              start = text.find(start_marker)
              if start < 0:
                  raise SystemExit(f"missing legacy start marker: {start_marker}")
              end = text.find(end_marker, start)
              if end < 0:
                  raise SystemExit(f"missing legacy end marker: {end_marker}")
              end += len(end_marker)
              while end < len(text) and text[end] in "\r\n":
                  end += 1
              return text[:start] + text[end:]

          mobile = remove_marked_block(mobile, "/* EMPLOYEE OVERVIEW APP UI START */", "/* EMPLOYEE OVERVIEW APP UI END */")
          mobile = remove_marked_block(mobile, "/* EMPLOYEE ATTENDANCE DUPLICATION CLEANUP START */", "/* EMPLOYEE ATTENDANCE DUPLICATION CLEANUP END */")

          date_anchor = "            <h2>تسجيل الدوام</h2>\n            <p>{attendanceDateLabel}</p>"
          if page.count(date_anchor) != 1:
              raise SystemExit("attendance header date anchor missing")
          page = page.replace(date_anchor, "            <h2>تسجيل الدوام</h2>", 1)

          entry_path_anchor = 'const entryPath = resolve(root, "src/styles/dashboard-v2/dashboard-v2.css");\n'
          if entry_path_anchor not in contract:
              raise SystemExit("contract entry path anchor missing")
          contract = contract.replace(entry_path_anchor, entry_path_anchor + 'const mobilePath = resolve(root, "src/styles/EmployeePortalMobileNav.css");\n', 1)

          required_anchor = 'for (const path of [portalPath, overviewPath, cssPath, attendanceCssPath, entryPath]) {'
          if required_anchor not in contract:
              raise SystemExit("contract required paths anchor missing")
          contract = contract.replace(required_anchor, 'for (const path of [portalPath, overviewPath, cssPath, attendanceCssPath, entryPath, mobilePath]) {', 1)

          read_anchor = '  const entry = readFileSync(entryPath, "utf8");\n'
          if read_anchor not in contract:
              raise SystemExit("contract entry read anchor missing")
          contract = contract.replace(read_anchor, read_anchor + '  const mobile = readFileSync(mobilePath, "utf8");\n', 1)

          css_guard_anchor = '  if (/#[0-9a-f]{3,8}\\b/i.test(css)) {'
          if css_guard_anchor not in contract:
              raise SystemExit("contract css guard anchor missing")
          legacy_guard = (
              '  if (mobile.includes("EMPLOYEE OVERVIEW APP UI START") || mobile.includes("EMPLOYEE ATTENDANCE DUPLICATION CLEANUP START")) {\n'
              '    errors.push("EmployeePortalMobileNav.css still contains legacy employee overview/attendance presentation.");\n'
              '  }\n\n'
              '  const referenceAttendanceCssMarkers = [\n'
              '    "grid-template-columns: minmax(0, 1fr) 108px minmax(0, 1fr);",\n'
              '    "min-height: 170px;",\n'
              '    "width: 98px;",\n'
              '    "height: 98px;",\n'
              '    "min-height: 92px;",\n'
              '  ];\n'
              '  for (const marker of referenceAttendanceCssMarkers) {\n'
              '    if (!attendanceCss.includes(marker)) errors.push(`Employee attendance reference layout marker missing: ${marker}`);\n'
              '  }\n\n'
          )
          contract = contract.replace(css_guard_anchor, legacy_guard + css_guard_anchor, 1)

          mobile_path.write_text(mobile, encoding="utf-8")
          page_path.write_text(page, encoding="utf-8")
          contract_path.write_text(contract, encoding="utf-8")
          PY

      - name: Remove temporary workflow
        run: rm .github/workflows/employee-attendance-reference-1to1-temp.yml

      - name: Install exact lockfile
        run: npm ci

      - name: Employee overview V2 contract
        run: npm run check:employee-portal-overview-v2

      - name: Dashboard V2 contract
        run: npm run check:dashboard-v2

      - name: Repository hygiene
        run: npm run check:repo-hygiene

      - name: Build
        run: npm run build

      - name: Diff check
        run: git diff --check

      - name: Verify scope
        shell: bash
        run: |
          mapfile -t changed < <(git diff --name-only HEAD)
          printf '%s\n' "${changed[@]}"
          allowed='^(src/pages/hr/EmployeeOverview\.tsx|src/styles/EmployeePortalMobileNav\.css|scripts/check-employee-portal-overview-v2\.mjs|\.github/workflows/employee-attendance-reference-1to1-temp\.yml)$'
          for file in "${changed[@]}"; do
            [[ "$file" =~ $allowed ]] || { echo "Unexpected changed file: $file"; exit 1; }
          done
          [[ ${#changed[@]} -eq 4 ]] || { echo "Expected exactly 4 scoped changes"; exit 1; }

      - name: Commit exact reference layout to main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- src/pages/hr/EmployeeOverview.tsx src/styles/EmployeePortalMobileNav.css scripts/check-employee-portal-overview-v2.mjs .github/workflows/employee-attendance-reference-1to1-temp.yml
          git commit -m "Match employee attendance reference layout"
          git push origin HEAD:main
