name: Fix Employee Save Persistence Temp

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-employee-save-persistence-temp.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply employee save persistence fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          dashboard_path = Path("src/pages/DashboardEmployees.tsx")
          check_path = Path("scripts/check-dashboard-employees-save-persistence.mjs")
          workflow_path = Path(".github/workflows/fix-employee-save-persistence-temp.yml")

          source = dashboard_path.read_text(encoding="utf-8")

          old_import = '''  getDoc,\n  getDocs,\n  doc,'''
          new_import = '''  getDoc,\n  getDocFromServer,\n  getDocs,\n  getDocsFromServer,\n  doc,'''
          if source.count(old_import) != 1:
              raise SystemExit(f"Firestore import anchor count={source.count(old_import)}")
          source = source.replace(old_import, new_import, 1)

          old_staff_load = '''          getDocs(staffPublicCol()),'''
          new_staff_load = '''          getDocsFromServer(staffPublicCol()),'''
          if source.count(old_staff_load) != 1:
              raise SystemExit(f"staff_public load anchor count={source.count(old_staff_load)}")
          source = source.replace(old_staff_load, new_staff_load, 1)

          old_dedupe = '''          const existingPriority = sourcePriority[String(existing.source || "users")] || 0;\n          const incomingPriority = sourcePriority[source] || 0;\n          const primary = incomingPriority >= existingPriority ? row : existing;\n          const fallback = incomingPriority >= existingPriority ? existing : row;\n          const merged = mergeEmployeeRows(primary, fallback);'''
          new_dedupe = '''          const existingPriority = sourcePriority[String(existing.source || "users")] || 0;\n          const incomingPriority = sourcePriority[source] || 0;\n          const existingUpdatedAt = toComparableTimestamp(existing.updatedAt);\n          const incomingUpdatedAt = toComparableTimestamp(row.updatedAt);\n          const incomingWins =\n            incomingPriority > existingPriority ||\n            (incomingPriority === existingPriority && incomingUpdatedAt > existingUpdatedAt);\n          const primary = incomingWins ? row : existing;\n          const fallback = incomingWins ? existing : row;\n          const merged = mergeEmployeeRows(primary, fallback);'''
          if source.count(old_dedupe) != 1:
              raise SystemExit(f"dedupe anchor count={source.count(old_dedupe)}")
          source = source.replace(old_dedupe, new_dedupe, 1)

          old_verify = '''      const savedStaffSnap = await getDoc(staffPublicDoc(targetEmployeeId));\n      employeeSaveDebug("reload result", {\n        employeeId: targetEmployeeId,\n        staffPublicExists: savedStaffSnap.exists(),\n      });\n      if (!savedStaffSnap.exists()) {\n        throw new Error("تعذر قراءة ملف الموظفة من staff_public بعد الحفظ.");\n      }\n      const activeTabBeforeReload = activeTab;\n      const modalTabBeforeReload = modalTab;\n      const reloadedRows = await load();\n      const reloadedEmployee = reloadedRows.find(\n        (row) =>\n          row.id === targetEmployeeId ||\n          employeeMatchesIdentity(row, selectedEmployeeIdentityRef.current)\n      );\n      if (reloadedEmployee) {\n        openEdit(reloadedEmployee, false);\n        setActiveTab(activeTabBeforeReload);\n        setModalTab(\n          ["basic", "profile", "services", "booking"].includes(activeTabBeforeReload)\n            ? (activeTabBeforeReload as EmployeeModalTab)\n            : modalTabBeforeReload\n        );\n        selectedEmployeeIdentityRef.current = employeeIdentityOf(reloadedEmployee);\n      }'''

          new_verify = '''      const expectedEditableSnapshot = {\n        basic: {\n          name: cleanName,\n          active: !!active,\n          showOnAbout: !!showOnAbout,\n          showOnBooking: effectiveShowOnBooking,\n          includeInEmployeeManagement: !!includeInEmployeeManagement,\n        },\n        profile: {\n          avatarUrl: resolveAvatarFromAssets(avatarUrl.trim()),\n          bio: cleanText(bio),\n          cvUrl: cleanText(cvUrl),\n          rating: Math.min(5, safeNonNegativeNumber(rating, 0)),\n          reviewsCount: Math.floor(safeNonNegativeNumber(reviewsCount, 0)),\n        },\n        services: {\n          specialties: canonicalizeSpecialties(specialtiesFixed, serviceOptions)\n            .slice()\n            .sort((a, b) => a.localeCompare(b)),\n        },\n        booking: {\n          employmentEndDate: normalizedEmploymentEndDate,\n          attendanceZoneId: normalizedAttendanceZoneId,\n          useCustomWorkingHours: !!modalUseCustomWorkingHours,\n          customWorkingHours: normalizeWorkingHours(normalizedCustomWorkingHours),\n          customWorkingHourOverrides: normalizeWorkingHourOverrides(normalizedCustomHourOverrides),\n        },\n      };\n      const editableSnapshotOf = (source: Partial<StaffPublicUi> | Record<string, any>) => ({\n        basic: {\n          name: cleanText((source as any)?.name),\n          active: (source as any)?.active === true,\n          showOnAbout: (source as any)?.showOnAbout === true,\n          showOnBooking: (source as any)?.showOnBooking === true,\n          includeInEmployeeManagement: (source as any)?.includeInEmployeeManagement === true,\n        },\n        profile: {\n          avatarUrl: resolveAvatarFromAssets(pickAvatarUrl(source as any)),\n          bio: cleanText((source as any)?.bio),\n          cvUrl: cleanText((source as any)?.cvUrl),\n          rating: Math.min(5, safeNonNegativeNumber((source as any)?.rating, 0)),\n          reviewsCount: Math.floor(\n            safeNonNegativeNumber((source as any)?.reviewsCount || (source as any)?.reviewCount, 0)\n          ),\n        },\n        services: {\n          specialties: canonicalizeSpecialties((source as any)?.specialties, serviceOptions)\n            .slice()\n            .sort((a, b) => a.localeCompare(b)),\n        },\n        booking: {\n          employmentEndDate: normalizeLeaveUntil((source as any)?.employmentEndDate),\n          attendanceZoneId: resolveAttendanceZoneId(source as any),\n          useCustomWorkingHours: !!(source as any)?.useCustomWorkingHours,\n          customWorkingHours: normalizeWorkingHours((source as any)?.customWorkingHours),\n          customWorkingHourOverrides: normalizeWorkingHourOverrides(\n            (source as any)?.customWorkingHourOverrides\n          ),\n        },\n      });\n      const persistenceMismatchSections = (source: Partial<StaffPublicUi> | Record<string, any>) => {\n        const actual = editableSnapshotOf(source);\n        return (Object.keys(expectedEditableSnapshot) as Array<keyof typeof expectedEditableSnapshot>).filter(\n          (section) => JSON.stringify(actual[section]) !== JSON.stringify(expectedEditableSnapshot[section])\n        );\n      };\n\n      const savedStaffSnap = await getDocFromServer(staffPublicDoc(targetEmployeeId));\n      employeeSaveDebug("server verification result", {\n        employeeId: targetEmployeeId,\n        staffPublicExists: savedStaffSnap.exists(),\n      });\n      if (!savedStaffSnap.exists()) {\n        throw new Error("تعذر قراءة ملف الموظفة من staff_public من السيرفر بعد الحفظ.");\n      }\n      const serverMismatchSections = persistenceMismatchSections(savedStaffSnap.data() as Record<string, any>);\n      if (serverMismatchSections.length) {\n        employeeSaveDebug("server verification mismatch", {\n          employeeId: targetEmployeeId,\n          sections: serverMismatchSections,\n        });\n        throw new Error(\n          `لم يتم تثبيت التغييرات في مصدر الموظفة الرئيسي. الأقسام غير المطابقة: ${serverMismatchSections.join("، ")}`\n        );\n      }\n\n      const activeTabBeforeReload = activeTab;\n      const modalTabBeforeReload = modalTab;\n      const reloadedRows = await load();\n      const reloadedEmployee = reloadedRows.find(\n        (row) =>\n          row.id === targetEmployeeId ||\n          employeeMatchesIdentity(row, selectedEmployeeIdentityRef.current)\n      );\n      if (!reloadedEmployee) {\n        throw new Error("تمت كتابة البيانات لكن تعذر إعادة تحميل الموظفة من المصدر الرئيسي بعد الحفظ.");\n      }\n      const reloadMismatchSections = persistenceMismatchSections(reloadedEmployee);\n      if (reloadMismatchSections.length) {\n        employeeSaveDebug("rehydration verification mismatch", {\n          employeeId: targetEmployeeId,\n          reloadedEmployeeId: reloadedEmployee.id,\n          reloadedSource: (reloadedEmployee as any)?.source || null,\n          reloadedSourceDocId: cleanText((reloadedEmployee as any)?.sourceDocId),\n          reloadedStaffPublicDocId: cleanText((reloadedEmployee as any)?.staffPublicDocId),\n          sections: reloadMismatchSections,\n        });\n        throw new Error(\n          `تمت الكتابة في Firestore لكن إعادة تحميل ملف الموظفة أعادت قيماً مختلفة. الأقسام: ${reloadMismatchSections.join("، ")}`\n        );\n      }\n\n      openEdit(reloadedEmployee, false);\n      setActiveTab(activeTabBeforeReload);\n      setModalTab(\n        ["basic", "profile", "services", "booking"].includes(activeTabBeforeReload)\n          ? (activeTabBeforeReload as EmployeeModalTab)\n          : modalTabBeforeReload\n      );\n      selectedEmployeeIdentityRef.current = employeeIdentityOf(reloadedEmployee);'''

          if source.count(old_verify) != 1:
              raise SystemExit(f"verification anchor count={source.count(old_verify)}")
          source = source.replace(old_verify, new_verify, 1)

          dashboard_path.write_text(source, encoding="utf-8")

          check_path.write_text(r'''import { readFileSync } from "node:fs";
import { resolve } from "node:path";

const file = resolve(process.cwd(), "src/pages/DashboardEmployees.tsx");
const source = readFileSync(file, "utf8");
const errors = [];

const required = [
  "getDocFromServer,",
  "getDocsFromServer,",
  "getDocsFromServer(staffPublicCol())",
  "incomingUpdatedAt > existingUpdatedAt",
  "const expectedEditableSnapshot = {",
  "const persistenceMismatchSections =",
  "await getDocFromServer(staffPublicDoc(targetEmployeeId))",
  "server verification mismatch",
  "rehydration verification mismatch",
  "if (!reloadedEmployee) {",
  "لم يتم تثبيت التغييرات في مصدر الموظفة الرئيسي",
];

for (const marker of required) {
  if (!source.includes(marker)) errors.push(`Missing employee save persistence guard: ${marker}`);
}

if (source.includes("const primary = incomingPriority >= existingPriority ? row : existing;")) {
  errors.push("Employee dedupe still lets arbitrary same-priority rows overwrite newer data.");
}

const successIndex = source.indexOf('coreSyncWarning\n          ? `تم حفظ التغييرات بنجاح');
const serverVerifyIndex = source.indexOf("server verification mismatch");
const reloadVerifyIndex = source.indexOf("rehydration verification mismatch");
if (successIndex < 0 || serverVerifyIndex < 0 || reloadVerifyIndex < 0) {
  errors.push("Could not locate save-success/verification ordering markers.");
} else if (!(serverVerifyIndex < successIndex && reloadVerifyIndex < successIndex)) {
  errors.push("Employee save success can still be emitted before persistence verification.");
}

if (errors.length) {
  console.error("Dashboard employee save persistence contract failed:\n");
  errors.forEach((error) => console.error(`- ${error}`));
  process.exit(1);
}

console.log("Dashboard employee save persistence contract passed.");
''', encoding="utf-8")

          if workflow_path.exists():
              workflow_path.unlink()
          PY

      - name: Install dependencies
        run: npm ci

      - name: Employee save persistence contract
        run: node scripts/check-dashboard-employees-save-persistence.mjs

      - name: Employee profile V2 contract
        run: npm run check:employee-profile-v2

      - name: Dashboard V2 contract
        run: npm run check:dashboard-v2

      - name: Build
        run: npm run build

      - name: Diff check
        run: git diff --check

      - name: Verify scope
        shell: bash
        run: |
          mapfile -t changed < <(git diff --name-only HEAD)
          printf '%s\n' "${changed[@]}"
          allowed='^(src/pages/DashboardEmployees\.tsx|scripts/check-dashboard-employees-save-persistence\.mjs|\.github/workflows/fix-employee-save-persistence-temp\.yml)$'
          for file in "${changed[@]}"; do
            [[ "$file" =~ $allowed ]] || { echo "Unexpected changed file: $file"; exit 1; }
          done
          [[ ${#changed[@]} -eq 3 ]] || { echo "Expected exactly 3 scoped changes"; exit 1; }

      - name: Commit fix to main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- src/pages/DashboardEmployees.tsx scripts/check-dashboard-employees-save-persistence.mjs .github/workflows/fix-employee-save-persistence-temp.yml
          git commit -m "Fix employee profile save persistence"
          git push origin HEAD:main
