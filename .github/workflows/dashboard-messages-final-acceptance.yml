name: Dashboard Messages Final Acceptance

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/dashboard-messages-final-acceptance.yml"
      - "src/pages/hr/AdminMessagesV2.tsx"
      - "src/pages/hr/EmployeeMessages.tsx"
      - "src/pages/hr/EmployeeMessagesLegacy.tsx"
      - "src/styles/dashboard-v2/pages/admin-messages.css"
      - "src/styles/dashboard-v2/pages/admin-messages-metrics.css"
      - "scripts/check-dashboard-messages-v2.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Dashboard messages migration guard
        run: node scripts/check-dashboard-messages-v2.mjs

      - name: Build
        run: npm run build

      - name: Diff check
        run: git diff --check HEAD^ HEAD
