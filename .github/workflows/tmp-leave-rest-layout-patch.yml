name: Temporary Leave Rest Layout Patch

on:
  push:
    branches:
      - fix/leave-rest-layout-opening-history

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/leave-rest-layout-opening-history
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply patch
        run: node scripts/tmp-leave-rest-layout-patch.mjs
      - name: Commit patch
        run: |
          rm -f scripts/tmp-leave-rest-layout-patch.mjs
          rm -f .github/workflows/tmp-leave-rest-layout-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(hr): simplify leave opening setup and layout"
          git push origin HEAD:fix/leave-rest-layout-opening-history
