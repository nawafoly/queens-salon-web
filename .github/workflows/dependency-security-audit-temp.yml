name: Dependency Security Audit Temp

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/dependency-security-audit-temp.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulate-remediation:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install lockfile exactly
        run: npm ci

      - name: Apply non-breaking npm audit fixes in ephemeral checkout
        shell: bash
        run: npm audit fix || true

      - name: Upgrade React Router within v7
        run: npm install --save 'react-router-dom@^7.18.2'

      - name: Upgrade SheetJS from authoritative distribution
        run: npm install --save 'https://cdn.sheetjs.com/xlsx-0.20.3/xlsx-0.20.3.tgz'

      - name: Report resulting production audit
        shell: bash
        run: |
          npm audit --omit=dev --json > prod-after.json || true
          node <<'NODE'
          const fs = require('fs');
          const a = JSON.parse(fs.readFileSync('prod-after.json','utf8'));
          console.log('=== PROD AFTER ===');
          console.log(JSON.stringify(a.metadata?.vulnerabilities || {}, null, 2));
          for (const [name,v] of Object.entries(a.vulnerabilities || {})) {
            console.log(JSON.stringify({name,severity:v.severity,isDirect:v.isDirect,range:v.range,fixAvailable:v.fixAvailable}));
          }
          NODE

      - name: Report resulting full audit
        shell: bash
        run: |
          npm audit --json > full-after.json || true
          node <<'NODE'
          const fs = require('fs');
          const a = JSON.parse(fs.readFileSync('full-after.json','utf8'));
          console.log('=== FULL AFTER ===');
          console.log(JSON.stringify(a.metadata?.vulnerabilities || {}, null, 2));
          for (const [name,v] of Object.entries(a.vulnerabilities || {})) {
            console.log(JSON.stringify({name,severity:v.severity,isDirect:v.isDirect,range:v.range,fixAvailable:v.fixAvailable}));
          }
          NODE

      - name: Show dependency changes
        shell: bash
        run: |
          git diff --stat
          echo '=== PACKAGE.JSON DIFF ==='
          git diff -- package.json
          echo '=== KEY VERSIONS ==='
          npm ls react-router-dom react-router firebase protobufjs @grpc/grpc-js websocket-driver @aws-sdk/xml-builder fast-xml-parser fast-xml-builder xlsx --depth=10 || true

      - name: Repository hygiene guard
        run: npm run check:repo-hygiene

      - name: Dashboard V2 contracts
        run: npm run check:dashboard-v2

      - name: Internal booking contract
        run: npm run check:booking-internal-contract

      - name: No legacy booking runtime guard
        run: node scripts/check-no-legacy-booking-runtime.mjs

      - name: Booking runtime audit
        run: node scripts/audit-legacy-booking-runtime.mjs

      - name: Build
        run: npm run build

      - name: Core worker tests
        run: npm run test:core:worker

      - name: HR worker tests
        run: npm run test:hr:worker

      - name: Frontend Core migration tests
        run: npm run test:frontend:core

      - name: Frontend Core migration guard
        run: npm run check:frontend-core-migration

      - name: Diff check
        run: git diff --check
