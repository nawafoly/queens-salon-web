name: Dependency Security Audit Temp

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/dependency-security-audit-temp.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install lockfile exactly
        run: npm ci

      - name: Trace production vulnerability dependency chains
        shell: bash
        run: |
          for pkg in protobufjs websocket-driver react-router react-router-dom xlsx fast-xml-parser fast-xml-builder @aws-sdk/xml-builder @grpc/grpc-js @protobufjs/utf8; do
            echo "=== CHAIN: $pkg ==="
            npm explain "$pkg" || true
          done

      - name: Check safe audit-fix plan without modifying files
        shell: bash
        run: |
          echo "=== AUDIT FIX DRY RUN ==="
          npm audit fix --dry-run --json > audit-fix-dry.json || true
          node <<'NODE'
          const fs = require('fs');
          const a = JSON.parse(fs.readFileSync('audit-fix-dry.json','utf8'));
          console.log(JSON.stringify({
            added:a.added,
            removed:a.removed,
            changed:a.changed,
            audited:a.audited,
            vulnerabilities:a.audit?.metadata?.vulnerabilities || a.metadata?.vulnerabilities || null
          }, null, 2));
          NODE
