name: Dashboard Action Feedback Codemod

on:
  push:
    branches:
      - fix/dashboard-action-feedback-system-20261004
    paths:
      - ".github/workflows/dashboard-action-feedback-codemod.yml"
      - "scripts/apply-dashboard-action-feedback-system.mjs"
      - "scripts/apply-contextual-feedback-bookings.mjs"
      - "scripts/prepatch-dashboard-refresh.mjs"

permissions:
  contents: write

concurrency:
  group: dashboard-action-feedback-codemod
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/dashboard-action-feedback-system-20261004
          fetch-depth: 0

      - name: Apply dashboard feedback patches
        run: |
          node scripts/prepatch-dashboard-refresh.mjs
          node scripts/apply-dashboard-action-feedback-system.mjs
          node scripts/apply-contextual-feedback-bookings.mjs

      - name: Commit generated source changes
        run: |
          if git diff --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git diff --cached --check
          git commit -m "fix(ui): keep action failures in their workflow context"
          git push origin HEAD:fix/dashboard-action-feedback-system-20261004
